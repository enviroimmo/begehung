<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b6b61">
<title>Begehung – Räume erfassen &amp; Bericht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<style>
:root{
  --bg:#f3f4f6; --surface:#fff; --surface-2:#f8f9fb; --ink:#18212d; --muted:#5b6676; --faint:#8a93a1;
  --line:#dde1e7; --line-strong:#c6ccd5;
  --primary:#0b6b61; --primary-hover:#095a52; --primary-soft:#e2f1ee; --primary-ink:#fff;
  --danger:#c2352b; --danger-soft:#fbe9e7; --warn:#b86a00; --warn-soft:#fff3df;
  --st-offen:#7d8899; --st-ok:#2b9a55; --st-mangel:#e07a16; --st-krit:#d1352a; --st-nz:#7656c4;
  --radius:10px; --radius-sm:7px; --tap:44px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.18);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg); font-size:15px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;width:100%}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px;z-index:20}
.topbar .title{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.topbar .title small{overflow:hidden;text-overflow:ellipsis}
.topbar>.tabs,.topbar>.sync,.topbar>.btn{flex:none}
.topbar .title small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:3px}
.tab{border:0;background:transparent;padding:0 14px;height:38px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--st-ok)}
.sync.busy .dot{background:var(--warn)}
.sync.off .dot{background:var(--danger)}
.sync.local .dot{background:var(--st-offen)}
.sync{cursor:pointer}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--tap);padding:0 15px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface-2)}
a.btn{text-decoration:none;color:inherit}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--danger);border-color:#e6b3ae}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:36px;padding:0 11px;font-size:14px}
.btn.icon{width:var(--tap);padding:0}
.btn.sm.icon{width:36px}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg{width:100%;height:100%}
.sm .ico{width:18px;height:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hidden{display:none!important}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:550}
label.fld.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:450;font-size:15px;min-height:36px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:var(--tap);padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;font-size:15px;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;min-height:42px;padding:0 8px;cursor:pointer;font-weight:550;color:var(--muted);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button .sw{width:10px;height:10px;border-radius:50%}
.seg button.active{background:var(--primary-soft);color:var(--primary)}
.seg button.active.st-ok{background:#e3f4ea;color:#1d7a41}
.seg button.active.st-nz{background:#eee8f9;color:#5b3fa6}
.seg button.active.z-gut{background:#e3f4ea;color:#1d7a41}
.seg button.active.z-mittel{background:#fff1dc;color:#9a5a00}
.seg button.active.z-schlecht{background:#fbe5e3;color:#a8271e}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:#e3f4ea;color:#1d7a41;border-color:#bfe3cc}
.badge.warn{background:#fff1dc;color:#9a5a00;border-color:#f5d7a5}
.badge.crit{background:#fbe5e3;color:#a8271e;border-color:#f1bfba}
.badge.nz{background:#eee8f9;color:#5b3fa6;border-color:#d6caf1}
.stdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}

/* ---------- pages ---------- */
.page{overflow:auto;height:100%}
.page-inner{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.page h1{font-size:24px;margin:0}
.page h2{font-size:18px;margin:26px 0 10px}
.page h3{font-size:15.5px;margin:18px 0 8px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.proj{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.proj:hover{border-color:var(--primary)}
.proj .pn{font-weight:650;font-size:16.5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:18px;color:var(--ink);font-weight:600;margin-bottom:6px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.howto .card{padding:14px}
.howto b{display:block;margin-bottom:4px}
.section{padding:16px 18px;margin-top:14px}
.section h2{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0 4px}
.stat{padding:12px 14px}
.stat .v{font-size:24px;font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter>div{height:100%;background:var(--primary)}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f6faf9}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:14px 0}

/* ---------- plan view ---------- */
.planview{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;height:100%;min-height:0}
.pv-toolbar{grid-column:1/-1;min-width:0;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pv-toolbar::-webkit-scrollbar{display:none}
.pv-toolbar select{width:auto;max-width:340px;min-width:180px;height:40px;min-height:40px;padding:6px 10px}
.pv-main{position:relative;min-width:0;min-height:0;background:#e4e7eb}
.pv-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pv-viewport.m-rect,.pv-viewport.m-poly{cursor:crosshair}
.pv-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.pv-world canvas{position:absolute;display:block}
.pv-world svg{position:absolute;left:0;top:0;overflow:visible}
.pv-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pv-loading span{background:rgba(255,255,255,.95);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:550}
.pv-hud{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.pv-hud>*{pointer-events:auto}
.legend{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.pv-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px)}
.pv-hint .btn{height:34px;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.pv-hint .btn.primary{background:#fff;color:var(--ink)}
.pv-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.pv-zoom .btn{background:rgba(255,255,255,.96);box-shadow:var(--shadow)}
.pv-zoom .btn.on{background:var(--primary-soft)}
.no-labels svg .lbl{display:none}

svg .room{stroke-width:1.6;vector-effect:non-scaling-stroke;fill-opacity:.22;stroke-opacity:.95;cursor:pointer}
svg .room.st-offen{fill:var(--st-offen);stroke:#566275}
svg .room.st-ok{fill:var(--st-ok);stroke:#1f7a42}
svg .room.st-mangel{fill:var(--st-mangel);stroke:#b35d0b}
svg .room.st-krit{fill:var(--st-krit);stroke:#a3241b}
svg .room.st-nz{fill:var(--st-nz);stroke:#56399e}
svg .room.sel{stroke:#0a4a8f;stroke-width:3.2;fill-opacity:.36;stroke-dasharray:none}
svg .room.dim{fill-opacity:.08;stroke-opacity:.35}
svg .lbl{font-size:calc(12.5px * var(--u,1));font-weight:700;fill:#10243a;paint-order:stroke;stroke:#fff;stroke-width:calc(3px * var(--u,1));stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .lbl.sub{font-weight:500;font-size:calc(10.5px * var(--u,1))}
svg .draft{fill:#0a4a8f;fill-opacity:.12;stroke:#0a4a8f;stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4}
svg .draft-line{fill:none;stroke:#0a4a8f;stroke-width:2;vector-effect:non-scaling-stroke}
svg .vtx{r:calc(5px * var(--u,1));fill:#fff;stroke:#0a4a8f;stroke-width:2;vector-effect:non-scaling-stroke}
svg .vtx.first{r:calc(8px * var(--u,1));fill:#0a4a8f}
svg .handle{r:calc(9px * var(--u,1));fill:#fff;stroke:#0a4a8f;stroke-width:2.5;vector-effect:non-scaling-stroke}
svg .snap{r:calc(10px * var(--u,1));fill:none;stroke:#e0157a;stroke-width:2;vector-effect:non-scaling-stroke}

/* ---------- room panel ---------- */
.panel{width:400px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100%}
.panel-head{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.panel-head .t{font-size:18px;font-weight:700;line-height:1.25}
.panel-head .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.panel-actions{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.panel-body{overflow:auto;padding:4px 16px 40px;flex:1;-webkit-overflow-scrolling:touch}
.psec{padding:12px 0;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0}
.psec.notes-sec{background:var(--primary-soft);margin:0 -16px;padding:12px 16px 14px;border-bottom:1px solid #c9e3de}
.psec.notes-sec>.h{color:var(--primary);font-size:13.5px}
.psec.notes-sec>.h .ico{width:17px;height:17px}
textarea.notes{min-height:150px;font-size:16.5px;line-height:1.5;border:1.5px solid #9fcac2;background:#fff;resize:vertical}
.cover-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;max-width:420px;aspect-ratio:4/3;border:2px dashed var(--line-strong);border-radius:8px;color:var(--muted);background:var(--surface-2)}
.cover-img{width:100%;max-width:420px;max-height:320px;object-fit:contain;border-radius:8px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.psec>.h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.psec>.h .grow{flex:1}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:span 2}
.mangel{border:1px solid var(--line);border-left:4px solid var(--st-mangel);border-radius:var(--radius-sm);padding:8px;margin-bottom:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.mangel.p-hoch{border-left-color:var(--st-krit)}
.mangel.p-gering{border-left-color:#e3b23c}
.mangel textarea{min-height:60px}
.mangel .row select{flex:1;min-height:38px;height:38px;padding:4px 8px;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.photo{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.photo .im{position:relative;aspect-ratio:4/3;background:#d9dde3;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pend{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;border-radius:99px}
.photo .num{position:absolute;right:6px;top:6px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.92);padding:1px 7px;border-radius:99px}
.photo input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:38px;font-size:13.5px;padding:6px 8px}
.photo input:focus{outline-offset:-2px}
.inspected{font-size:12.5px;color:var(--muted);margin-top:10px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn{position:relative;overflow:hidden}
.file-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;margin:0;padding:0;border:0;z-index:1}
.filebtn:focus-within{outline:2px solid var(--primary);outline-offset:1px}
.drop-on{outline:3px dashed var(--primary);outline-offset:-8px;background-color:var(--primary-soft)}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:center;justify-content:center;z-index:130;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:520px;max-width:100%;max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.modal.wide{width:760px}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .left{margin-right:auto}
.lightbox{position:fixed;inset:0;background:rgba(8,12,18,.94);z-index:120;display:flex;flex-direction:column}
.lightbox .lb-top{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}
.lightbox .lb-top .grow{font-size:14px;opacity:.9}
.lightbox .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.lightbox .lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 10px 14px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14.5px;max-width:min(560px,92vw);pointer-events:auto}
.toast.error{background:var(--danger)}
.toast.ok{background:#1d6e43}
.banner{padding:10px 14px;background:var(--warn-soft);color:#7a4700;border-bottom:1px solid #f0d6a8;font-size:14px}
.progress{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.spinner{width:18px;height:18px;border:2.5px solid var(--line-strong);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.field-row{display:grid;grid-template-columns:1.4fr 1fr 1.6fr auto;gap:8px;align-items:center;margin-bottom:8px}
.field-row input,.field-row select{min-height:40px;height:40px;padding:6px 9px;font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .lastbtn .lbl{display:none}
  .lastbtn{width:var(--tap);padding:0}
}
@media (max-width:1000px){
  .tab .lbl{display:none}
  .tab{padding:0 12px}
  .sync .txt{display:none}
}
@media (max-width:900px){
  .planview{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .panel{width:100%;height:auto;max-height:58vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
  .howto{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .grid2,.grid3,.fields{grid-template-columns:1fr}
  .span2,.fields .wide{grid-column:auto}
  .topbar .title{font-size:15px}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module">
// ======================================================================
// Platform layer: installable offline app (data on the device, sync via OneDrive)
// ======================================================================

// ---------- local document store (same interface as the Claude db capability) ----------
const LocalDB = (() => {
  const mem = new Map(); // path -> {path, data, ts, del, dirty}
  const subs = new Set();
  let lastTs = 0;
  const now = () => (lastTs = Math.max(Date.now(), lastTs + 1));
  const colOf = (p) => p.split('/').slice(0, -1).join('/');
  const snapDoc = (path, rec) => ({
    id: path.split('/').pop(), exists: !!rec && !rec.del,
    data: () => (rec && !rec.del ? rec.data : undefined),
    metadata: { fromCache: false, hasPendingWrites: false },
  });
  const fire = (sub) => {
    const docs = [];
    for (const [p, r] of mem) if (!r.del && colOf(p) === sub.col) docs.push(snapDoc(p, r));
    docs.sort((a, b) => (a.id < b.id ? -1 : 1));

const Blobs = {
  waiting: new Map(),
  async get(id) { const r = await IDB.get('blobs', id); return r && r.blob ? r : null; },
  async put(id, blob, type) { await IDB.put('blobs', { id, blob, type: type || blob.type, size: blob.size, ts: Date.now() }); this.ready(id); },
  async fetch(id) {
    const r = await this.get(id);
    if (r) return r.blob;
    const b = await Cloud.downloadBlob(id);
    if (!b) throw new Error('Datei ist auf diesem Gerät noch nicht vorhanden (Abgleich mit OneDrive ausstehend).');
    return b;
  },
  ready(id) {
    const cbs = this.waiting.get(id);
    if (!cbs) return;
    this.waiting.delete(id);
    for (const f of cbs) { try { f(); } catch { /* ignore */ } }
  },
  retryImg(img, id) {
    const apply = async () => {
      if (navigator.serviceWorker?.controller) { img.src = blobUrl(id) + '?v=' + Date.now(); return; }
      const r = await this.get(id); // no service worker: use an object URL
      if (r) img.src = URL.createObjectURL(r.blob);
    };
    this.get(id).then((r) => {
      if (r) { apply(); return; }
      const cbs = this.waiting.get(id) || [];
      cbs.push(apply);
      this.waiting.set(id, cbs);
      Cloud.wantBlob(id);
    });
    return true;
  },
};

function polyArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j][0] + pts[i][0]) * (pts[j][1] - pts[i][1]);
  return Math.abs(a / 2);
}
function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }

}
function polyBBox(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}

  // area centroid; if outside (L-shapes), centre of widest horizontal run through the centroid row
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const f = pts[j][0] * pts[i][1] - pts[i][0] * pts[j][1];
    a += f; cx += (pts[j][0] + pts[i][0]) * f; cy += (pts[j][1] + pts[i][1]) * f;
  }
  if (Math.abs(a) < 1e-12) { const b = polyBBox(pts); return [b.x0 + b.w / 2, b.y0 + b.h / 2]; }
  cx /= 3 * a; cy /= 3 * a;
  if (pointInPoly(cx, cy, pts)) return [cx, cy];
  const b = polyBBox(pts);
  let best = null;
  for (let k = 1; k < 10; k++) {
    const y = b.y0 + (b.h * k) / 10;
    const xs = [];
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [x1, y1] = pts[j], [x2, y2] = pts[i];
      if ((y1 > y) !== (y2 > y)) xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const w = xs[i + 1] - xs[i];
      const score = w - Math.abs(y - cy) * 0.5;
      if (!best || score > best.s) best = { s: score, p: [(xs[i] + xs[i + 1]) / 2, y] };
    }
  }
  return best ? best.p : [cx, cy];
}

// ======================================================================
// Write queue: every change is queued locally first, then sent to the db.
// Survives short offline phases (e.g. basements) and page reloads.

const QKEY = 'begehung.writeQueue.v1';
const Q = {
  items: new Map(), seq: 0, running: false, offline: false, lastError: '', timer: null,
  load() {

      const raw = localStorage.getItem(QKEY);

    } catch { /* storage unavailable */ }
  },
  persist() {
    try { localStorage.setItem(QKEY, JSON.stringify([...this.items].map(([path, v]) => ({ path, op: v.op, data: v.data })))); } catch { /* ignore */ }
  },
  put(path, op, data) {
    if (data !== undefined) data = clone(data);
    const cur = this.items.get(path);

    if (!cur || op === 'set' || op === 'delete') next = { op, data };
    else if (cur.op === 'delete') { if (op === 'update') return; next = { op, data }; }
    else next = { op: cur.op, data: deepMerge(cur.data, data) };
    next.seq = ++this.seq;
    this.items.set(path, next);
    this.persist();
    syncUI();
    this.kick();
  },
  drop(path, seq) {
    const now = this.items.get(path);
    if (now && now.seq === seq) this.items.delete(path);
    this.persist();
  },
  async kick() {
    if (this.running || !RT.db) return;
    this.running = true;
    clearTimeout(this.timer);
    try {
      while (this.items.size) {
        const [path, it] = this.items.entries().next().value;
        let ref;
        try { ref = RT.db.doc(path); } catch (e) { console.warn('bad path', path, e); this.drop(path, it.seq); continue; }
        try {
          if (it.op === 'set') await withTimeout(ref.set(it.data), 25000);
          else if (it.op === 'update') await withTimeout(ref.update(it.data), 25000);
          else await withTimeout(ref.delete(), 25000);

            toast(msg, 'error', 6000);

// Photo queue: photos are kept locally until the upload succeeded.
// ======================================================================
const PQ = {
  items: new Map(), // id -> {id,pid,roomId,blob,caption,ts,w,h,url}
  running: false, timer: null, failed: 0,
  async load() {
    const all = (await IDB.all('pending')) || [];

  },
  async add(entry) {
    entry.url = URL.createObjectURL(entry.blob);
    this.items.set(entry.id, entry);
    const { url, ...persist } = entry;
    await IDB.put('pending', persist);
    syncUI(); emit('pending');
    this.kick();
  },
  forRoom(roomId) { return [...this.items.values()].filter((p) => p.roomId === roomId); },
  async remove(id) {

  async setCaption(id, caption) {

  async kick() {

            roomId: cur.roomId, assetId: res.id, caption: cur.caption || '', ts: cur.ts, w: cur.w, h: cur.h, bytes: res.sizeBytes || cur.blob.size,

function mapFor(path) {

  if (p.length === 4 && p[0] === 'projects' && p[1] === S.pid) {

      if (data) m.set(d.id, { ...clone(data), id: d.id });

    if (this.draft) this.draft.snap = null;
    if (cancelled) { if (g.type === 'rect') { this.draft.a = this.draft.b = null; } this.drawDraft(); return; }
    const p = this.local(e);
    if (g.type === 'pan') { this.scheduleDetail(); return; }
    if (g.type === 'rect') {
      const { a, b } = this.draft;
      this.draft.a = this.draft.b = null;
      this.drawDraft();
      if (!a || !b) return;
      const wpx = Math.abs(a[0] - b[0]) * this.view.s, hpx = Math.abs(a[1] - b[1]) * this.view.s;
      if (wpx < 14 || hpx < 14) { this.cb.onTap(this.hitRoom(this.toWorld(p))); return; }
      const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
      this.cb.onShape(this.norm([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]), this.draft.target);
      return;
    }
    if (g.type === 'vertex') { this.drawDraft(); return; }
    if (g.type === 'tap') this.tap(this.toWorld(p));
  }
  tap(w) {
    if (this.mode === 'poly') {
      const d = this.draft;
      if (d.pts.length >= 3) {
        const f = d.pts[0];
        if (Math.hypot(f[0] - w[0], f[1] - w[1]) * this.view.s < 18) { this.finishPoly(); return; }
      }
      d.pts.push(this.place(w));
      d.snap = null;
      this.drawDraft();
      this.cb.onDraftChange?.();
      return;
    }
    if (this.mode === 'edit') return;
    this.cb.onTap(this.hitRoom(w));
  }
}

// ======================================================================
// Plan upload & management
// ======================================================================
function canUpload() {
  if (RT.assets) return true;
  assetsUnavailable();
  return false;
}
function planUploadBtn(label, o = {}) {
  return fileBtn(label, { icon: 'upload', accept: ACCEPT_PLANS, multiple: true, check: canUpload, onFiles: (f) => uploadPlans(f), ...o });
}
async function uploadPlans(files) {
  if (!RT.assets) { assetsUnavailable(); return; }
  files = (files || []).filter((f) => /pdf|png|jpe?g|webp/i.test(f.type || '') || /\.(pdf|png|jpe?g|webp)$/i.test(f.name || ''));
  if (!files.length) { toast('Bitte PDF-, PNG- oder JPG-Dateien wählen.'); return; }
  const pid = S.pid;
  let order = Math.max(0, ...[...S.plans.values()].map((p) => (p.order ?? 0) + 1));
  let firstId = null;
  const bb = busyBox('Plan wird vorbereitet …');
  try {
    for (const file of files) {
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      let blob = file, mime = isPdf ? 'application/pdf' : file.type, pages = [], kind = isPdf ? 'pdf' : 'image';
      bb.set(`„${file.name}“ wird gelesen …`);
      if (isPdf) {
        if (file.size > PLATFORM.maxPlanMB * 1024 * 1024) { toast(`„${file.name}“ ist größer als ${PLATFORM.maxPlanMB} MB. Bitte die PDF verkleinern oder in mehrere Dateien teilen.`, 'error', 8000); continue; }
        const buf = await file.arrayBuffer();
        const pdf = await openPdf(new Uint8Array(buf.slice(0)));
        for (let i = 1; i <= pdf.numPages; i++) {
          const pg = await pdf.getPage(i);
          const vp = pg.getViewport({ scale: 1 });
          pages.push({ w: Math.round(vp.width), h: Math.round(vp.height), label: '', gebaeudeteil: '', stockwerk: '' });
        }
        closePdf(pdf);
        blob = new Blob([buf], { type: 'application/pdf' });
      } else {
        const bmp = await createImageBitmap(file);
        const max = 6000, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
        if (sc < 1 || file.size > 15 * 1024 * 1024 || !/^image\/(png|jpeg|webp)$/.test(file.type)) {
          const c = document.createElement('canvas');
          c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
          blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9)); mime = 'image/jpeg';
          pages.push({ w: c.width, h: c.height, label: '', gebaeudeteil: '', stockwerk: '' });
        } else pages.push({ w: bmp.width, h: bmp.height, label: '', gebaeudeteil: '', stockwerk: '' });
      }
      bb.set(`„${file.name}“ wird hochgeladen (${fmtBytes(blob.size)}) …`);
      const res = await withTimeout(RT.assets.upload(blob, { type: mime }), 300000, 'Upload dauert zu lange');
      const buf2 = await blob.arrayBuffer();
      await IDB.put('files', buf2, res.id);
      const id = uid('pl');
      firstId ||= id;
      saveDoc(`projects/${pid}/plans/${id}`, {
        name: file.name.replace(/\.(pdf|png|jpe?g|webp)$/i, ''), fileName: file.name, assetId: res.id, kind, mime,
        pageCount: pages.length, pages, order: order++, bytes: res.sizeBytes || blob.size, createdAt: Date.now(),
      });
    }
  } catch (e) {
    console.error(e);
    const code = e?.code;
    toast(code === 'too_large' ? `Datei ist zu groß (max. ${PLATFORM.maxPlanMB} MB).` : code === 'quota_or_state' ? 'Speicherplatz ist voll.' : 'Plan konnte nicht hochgeladen werden: ' + (e?.message || code || e), 'error', 8000);
  } finally { bb.close(); }
  if (firstId && S.pid === pid) {
    App.plan.planId = firstId; App.plan.page = 0; App.plan.roomId = null;
    if (App.view === 'project') showTab('plan');
    const pl = S.plans.get(firstId);
    if (pl && pl.pageCount > 1) toast(`${pl.pageCount} Seiten importiert. Tipp: Über „Seite“ jeder Seite Gebäudeteil und Stockwerk zuordnen.`, 'ok', 6000);
  }
}

            h('td', { style: { whiteSpace: 'nowrap' } },
              btn('', { icon: 'up', sm: true, alt: 'Nach oben', disabled: i === 0, onClick: () => swapOrder(ps, i, i - 1) }),
              btn('', { icon: 'down', sm: true, alt: 'Nach unten', disabled: i === ps.length - 1, onClick: () => swapOrder(ps, i, i + 1) }),
              ' ',
              btn('', { icon: 'trash', sm: true, kind: 'danger', alt: 'Plan löschen', onClick: () => deletePlan(p) })));
        })))) : h('div', { class: 'muted' }, 'Noch keine Pläne.'),
      h('div', { class: 'row' }, planUploadBtn('Plan hinzufügen', { onFiles: (f) => { dlg.close(); uploadPlans(f); } }), h('div', { class: 'grow small muted' }, 'Die Reihenfolge der Pläne bestimmt auch die Reihenfolge der Räume im Bericht.')),
    );
  };
  const swapOrder = (ps, a, b) => {
    const A = ps[a], B = ps[b];
    patchDoc(`projects/${S.pid}/plans/${A.id}`, { order: b });
    patchDoc(`projects/${S.pid}/plans/${B.id}`, { order: a });
    ps.forEach((p, i) => { if (i !== a && i !== b && p.order !== i) patchDoc(`projects/${S.pid}/plans/${p.id}`, { order: i }); });
  };
  let dlg = null;
  render();
  const off = onData((k) => { if (k.has('plans') || k.has('rooms')) render(); });
  dlg = modal({
    title: 'Pläne verwalten', wide: true, body, onClose: off,
    actions: [{ label: 'Fertig', primary: true }],
  });
}

async function deletePlan(plan) {
  const rooms = [...S.rooms.values()].filter((r) => r.planId === plan.id);
  const photos = [...S.photos.values()].filter((ph) => rooms.some((r) => r.id === ph.roomId));
  const ok = await confirmBox('Plan löschen?', `„${plan.name}“ wird mit ${rooms.length} Räumen und ${photos.length} Fotos endgültig gelöscht.`, 'Endgültig löschen', true);
  if (!ok) return;
  for (const r of rooms) deleteRoomData(r, true);
  removeDoc(`projects/${S.pid}/plans/${plan.id}`);
  if (plan.assetId) { RT.assets?.delete(plan.assetId).catch(() => {}); IDB.del('files', plan.assetId); }
  if (App.plan.planId === plan.id) { App.plan.planId = null; App.plan.page = 0; App.plan.roomId = null; }
  if (App.tab === 'plan' && App.view === 'project' && !_modals.length) showTab('plan');
}

function deleteRoomData(room, silent) {
  for (const ph of [...S.photos.values()].filter((p) => p.roomId === room.id)) {
    removeDoc(`projects/${S.pid}/photos/${ph.id}`);
    if (ph.assetId) RT.assets?.delete(ph.assetId).catch(() => {});
  }
  for (const p of PQ.forRoom(room.id)) PQ.remove(p.id);
  removeDoc(`projects/${S.pid}/rooms/${room.id}`);
  if (!silent) toast('Raum gelöscht.');
}

  const progress = h('div', { class: 'legend' });

      h('span', null, h('i', { class: 'stdot', style: { background: 'var(--st-offen)' } }), 'offen'),

  const lblBtn = btn('', { icon: 'tag', alt: 'Raumnummern ein-/ausblenden', on: showLabels, onClick: () => {
    showLabels = !showLabels; lblBtn.classList.toggle('on', showLabels); pvMain.classList.toggle('no-labels', !showLabels);

    btn('', { icon: 'zin', alt: 'Vergrößern', onClick: () => App.viewer.zoomCenter(1.5) }),
    btn('', { icon: 'zout', alt: 'Verkleinern', onClick: () => App.viewer.zoomCenter(1 / 1.5) }),

  const panelHost = h('div', { class: 'hidden', style: { minHeight: 0, height: '100%' } });

  dropZone(pvMain, /pdf|png|jpe?g|webp/i, (f) => uploadPlans(f));

  const pageRooms = () => [...S.rooms.values()].filter((r) => r.planId === st.planId && (r.page || 0) === st.page);
  const viewer = new PlanViewer(pvMain, {

  }, 300);
  const savedView = (planId, page) => viewStore(S.pid).views[planId + '|' + page] || null;
  function currentEntry() { return { planId: st.planId, page: st.page, roomId: st.roomId, view: viewer.getViewState() }; }
  function pushHist(e = currentEntry()) {
    if (!e || !e.view) return;
    const h0 = App.planHist[App.planHist.length - 1];
    const same = h0 && h0.planId === e.planId && h0.page === e.page && Math.abs(h0.view.cx - e.view.cx) < 0.01 && Math.abs(h0.view.cy - e.view.cy) < 0.01 && Math.abs((h0.view.s || h0.view.zf) - (e.view.s || e.view.zf)) / (e.view.s || e.view.zf) < 0.05;
    if (!same) { App.planHist.push(e); if (App.planHist.length > 30) App.planHist.shift(); }
    updateLastBtn();
  }
  App.planBack = () => {
    const e = App.planHist.pop();

    goPage(e.planId, e.page, e.roomId && S.rooms.has(e.roomId) ? e.roomId : null, { view: e.view, noHist: true });
  };
  App.cleanup.push(() => { App.planBack = null; saveView.flush(); });

  // ---------- behaviour ----------
  function updateProgress() {
    const all = pageRooms();
    const done = all.filter((r) => r.status === 'begangen' || r.status === 'nz').length;
    const m = all.reduce((n, r) => n + (r.maengel?.length || 0), 0);
    progress.textContent = all.length ? `${done}/${all.length} Räume erfasst · ${m} Mängel` : 'Noch keine Räume auf dieser Seite – „Rechteck“ oder „Polygon“ wählen';
  }
  function updateModeButtons() {
    for (const [m, b] of Object.entries(modeBtns)) b.classList.toggle('on', viewer.mode === m || (m === 'view' && viewer.mode === 'edit'));
    prevB.disabled = !hasStep(-1); nextB.disabled = !hasStep(1);
  }
  function updateHint() {
    const m = viewer.mode, d = viewer.draft;
    hint.replaceChildren();
    if (m === 'view') { hint.classList.add('hidden'); updateModeButtons(); return; }
    hint.classList.remove('hidden');
    const tgt = d?.target ? S.rooms.get(d.target) : null;
    const pre = tgt ? `Neue Form für ${roomTitle(tgt)}: ` : '';
    if (m === 'rect') hint.append(h('span', null, pre + 'Rechteck aufziehen'), btn('Abbrechen', { sm: true, onClick: () => setMode('view') }));
    if (m === 'poly') {

      hint.append(h('span', null, pre + (n < 3 ? `Eckpunkte antippen (${n})` : `${n} Punkte – ersten Punkt antippen oder „Fertig“`)),
        btn('', { icon: 'undo', sm: true, alt: 'Letzten Punkt entfernen', disabled: !n, onClick: () => viewer.undoPoint() }),
        n >= 3 ? btn('Fertig', { sm: true, kind: 'primary', onClick: () => viewer.finishPoly() }) : null,
        btn('Abbrechen', { sm: true, onClick: () => setMode('view') }));
    }
    if (m === 'edit') {
      hint.append(h('span', null, 'Eckpunkte verschieben'),
        btn('Abbrechen', { sm: true, onClick: () => setMode('view') }),
        btn('Speichern', {
          sm: true, kind: 'primary', onClick: () => {
            const pts = viewer.editResult();
            const id = viewer.draft.roomId;
            if (pts && S.rooms.has(id)) patchDoc(`projects/${S.pid}/rooms/${id}`, { pts, updatedAt: Date.now() });

          },
        }));
    }
    updateModeButtons();
  }
  function setMode(m, opts = {}) {
    if (m !== 'view' && RT.canWrite === false) { toast('Nur Lesezugriff.'); return; }
    st.mode = m;
    viewer.setMode(m, opts);
    updateHint();
  }
  function hasStep(dir) {
    const seq = plansSorted().flatMap((p) => Array.from({ length: p.pageCount || 1 }, (_, i) => [p.id, i]));
    const i = seq.findIndex(([a, b]) => a === st.planId && b === st.page);
    return i + dir >= 0 && i + dir < seq.length;
  }
  function stepPage(dir) {
    const seq = plansSorted().flatMap((p) => Array.from({ length: p.pageCount || 1 }, (_, i) => [p.id, i]));
    const i = seq.findIndex(([a, b]) => a === st.planId && b === st.page);
    const n = seq[i + dir];
    if (n) goPage(n[0], n[1]);
  }
  async function goPage(planId, page, roomId = null, opts = {}) {
    if (!opts.noHist) pushHist();
    const same = planId === st.planId && page === st.page;
    st.planId = planId; st.page = page;
    App.remember();
    fillSelect();
    if (viewer.mode !== 'view') setMode('view');
    selectRoom(roomId, true);
    if (!same) await loadPage(opts.view || (roomId ? null : savedView(planId, page)));
    else if (opts.view) viewer.setViewState(opts.view);
    if (roomId && !opts.view) viewer.focusRoom(S.rooms.get(roomId));
    saveView();
  }
  async function loadPage(view) {
    updateModeButtons(); updateProgress();
    try { await viewer.load(curPlan(), st.page, view); }
    catch (e) {
      console.error(e);
      toast('Plan konnte nicht angezeigt werden: ' + (e?.message || e), 'error', 7000);
    }
  }
  function selectRoom(id, noFocus) {
    st.roomId = id && S.rooms.has(id) ? id : null;
    saveView();
    viewer.redraw();
    if (st.roomId) {
      panelHost.classList.remove('hidden');
      if (!App.panel || App.panel.roomId !== st.roomId) {
        App.panel = new RoomPanel(st.roomId, {
          close: () => selectRoom(null),
          editMeta: () => editRoomMeta(st.roomId),
          editShape: () => { const r = S.rooms.get(st.roomId); if (r) setMode('edit', { room: r }); },
          redraw: (type) => setMode(type, { target: st.roomId }),
          next: () => nextOpenRoom(),
        });
        panelHost.replaceChildren(App.panel.el);
      }
      if (!noFocus) { /* keep view */ }
    } else {
      panelHost.classList.add('hidden');
      panelHost.replaceChildren();
      App.panel = null;
    }
  }
  function nextOpenRoom() {
    const all = roomsSorted();
    const i = all.findIndex((r) => r.id === st.roomId);
    const rest = [...all.slice(i + 1), ...all.slice(0, Math.max(0, i))];
    const n = rest.find((r) => r.status !== 'begangen' && r.status !== 'nz');
    if (!n) { toast('Alle Räume sind erfasst. 🎉', 'ok'); return; }
    goPage(n.planId, n.page || 0, n.id);
  }
  function editRoomMeta(id) {
    const r = S.rooms.get(id);
    if (!r) return;
    roomDialog({
      room: r, title: 'Raumdaten bearbeiten',
      onSave: (vals) => patchDoc(`projects/${S.pid}/rooms/${id}`, { ...vals, updatedAt: Date.now() }),
      onDelete: () => { deleteRoomData(r); selectRoom(null); },
    });
  }
  function shapeDone(pts, target) {
    if (target && S.rooms.has(target)) {
      patchDoc(`projects/${S.pid}/rooms/${target}`, { pts, updatedAt: Date.now() });
      setMode('view');
      selectRoom(target);
      toast('Form aktualisiert.', 'ok');
      return;
    }
    const plan = curPlan();
    const pm = pageMeta(plan, st.page);
    const same = pageRooms().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const last = same[same.length - 1];
    const defaults = {
      gebaeudeteil: pm.gebaeudeteil || last?.gebaeudeteil || '',
      stockwerk: pm.stockwerk || last?.stockwerk || '',
      raumnr: nextLabel(last?.raumnr),
    };
    const keepMode = viewer.mode;
    roomDialog({
      title: 'Neuer Raum', defaults,
      onSave: (vals) => {
        const id = uid('r');
        saveDoc(`projects/${S.pid}/rooms/${id}`, {
          planId: st.planId, page: st.page, pts, ...vals, status: 'offen', zustand: '', notes: '', maengel: [], values: {},
          createdAt: Date.now(), updatedAt: Date.now(),
        });
        viewer.setMode(keepMode);
        st.roomId = id;
        viewer.redraw();
        updateHint(); updateProgress();
      },
      onCancel: () => { viewer.setMode(keepMode); updateHint(); },
    });
  }

  // keyboard shortcuts (desktop)
  const onKey = (e) => {
    if (_modals.length || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if (e.key === 'Escape') { if (viewer.mode !== 'view') setMode('view'); else if (st.roomId) selectRoom(null); }
    else if (e.key === 'Enter' && viewer.mode === 'poly') viewer.finishPoly();
    else if ((e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey))) && viewer.mode === 'poly') { e.preventDefault(); viewer.undoPoint(); }
    else if (e.key === 'r' || e.key === 'R') setMode('rect');
    else if (e.key === 'p' || e.key === 'P') setMode('poly');
    else if (e.key === 'b' || e.key === 'B' || e.key === 'v' || e.key === 'V') setMode('view');
    else if (e.key === '+') viewer.zoomCenter(1.4);
    else if (e.key === '-') viewer.zoomCenter(1 / 1.4);
    else if (e.key === '0') viewer.fit();
    else if (e.key === 'ArrowLeft' && e.altKey) { e.preventDefault(); App.planBack?.(); }
    else if (e.key === 'PageDown') stepPage(1);
    else if (e.key === 'PageUp') stepPage(-1);

  App.cleanup.push(onData((k) => {

      if (!S.plans.has(st.planId)) { showTab('plan'); return; }
      fillSelect(); updateModeButtons();
    }
    if (k.has('rooms')) {
      if (st.roomId && !S.rooms.has(st.roomId)) selectRoom(null);
      if (viewer.mode === 'edit' && !S.rooms.has(viewer.draft?.roomId)) setMode('view');
      if (viewer.mode !== 'edit' || k.has('plans')) viewer.redraw(); else viewer.redraw();
      updateProgress();
    }
    if (App.panel && (k.has('rooms') || k.has('photos') || k.has('projects') || k.has('pending'))) App.panel.refresh();
  }));

  fillSelect();
  updateHint();
  const goRoom = st.pendingRoom; st.pendingRoom = null;
  const stored = viewStore(S.pid);
  if (goRoom && stored.cur && S.plans.has(stored.cur.planId)) {
    const v = stored.views[stored.cur.planId + '|' + stored.cur.page];
    if (v) pushHist({ planId: stored.cur.planId, page: stored.cur.page || 0, roomId: stored.cur.roomId, view: v });
  }
  loadPage(goRoom ? null : savedView(st.planId, st.page)).then(() => {
    if (goRoom && S.rooms.has(goRoom)) { selectRoom(goRoom); viewer.focusRoom(S.rooms.get(goRoom)); return; }
    const cur = stored.cur;
    if (cur && cur.planId === st.planId && (cur.page || 0) === st.page && cur.roomId && S.rooms.has(cur.roomId)) selectRoom(cur.roomId);
  });
  updateLastBtn();
}

async function processPhoto(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight;
  const sc = Math.min(1, 2000 / Math.max(W, H));
  const c = document.createElement('canvas');
  c.width = Math.round(W * sc); c.height = Math.round(H * sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
  return { blob, w: c.width, h: c.height };
}

async function deletePhoto(ph) {
  if (ph.pending) { await PQ.remove(ph.id); return; }
  removeDoc(`projects/${S.pid}/photos/${ph.id}`);
  if (ph.assetId) RT.assets?.delete(ph.assetId).catch(() => {});

function openLightbox(roomId, index) {
  let i = index;
  const img = h('img');
  const info = h('div', { class: 'grow' });
  const lb = h('div', { class: 'lightbox' });
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  const show = () => {
    const list = photosForRoom(roomId);
    if (!list.length) { close(); return; }
    i = clamp(i, 0, list.length - 1);
    const ph = list[i];
    img.src = ph.src;
    const r = S.rooms.get(roomId);
    info.textContent = `Foto ${i + 1} von ${list.length} · ${r ? roomTitle(r) : ''}${ph.caption ? ' – ' + ph.caption : ''}`;
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') { i++; show(); } if (e.key === 'ArrowLeft') { i--; show(); } };
  lb.append(
    h('div', { class: 'lb-top' },
      btn('', { icon: 'left', alt: 'Vorheriges', onClick: () => { i--; show(); } }),
      btn('', { icon: 'right', alt: 'Nächstes', onClick: () => { i++; show(); } }),
      info,
      btn('Löschen', {
        icon: 'trash', onClick: async () => {
          const ph = photosForRoom(roomId)[i];
          if (!ph) return;
          if (!(await confirmBox('Foto löschen?', 'Das Foto wird endgültig gelöscht.', 'Löschen', true))) return;
          await deletePhoto(ph);
          setTimeout(show, 50);
        },
      }),
      btn('', { icon: 'x', alt: 'Schließen', onClick: close })),
    h('div', { class: 'lb-img', onclick: (e) => { if (e.target === e.currentTarget) close(); } }, img));
  // swipe
  let sx = null;
  img.addEventListener('pointerdown', (e) => { sx = e.clientX; });
  img.addEventListener('pointerup', (e) => { if (sx != null && Math.abs(e.clientX - sx) > 50) { i += e.clientX < sx ? 1 : -1; show(); } sx = null; });
  document.body.append(lb);
  document.addEventListener('keydown', onKey);
  show();
}

function projectStats(rooms = [...S.rooms.values()]) {
  const st = { total: rooms.length, begangen: 0, nz: 0, offen: 0, maengel: 0, hoch: 0, mittel: 0, gering: 0, fotos: 0 };
  for (const r of rooms) {
    if (r.status === 'begangen') st.begangen++; else if (r.status === 'nz') st.nz++; else st.offen++;
    for (const m of r.maengel || []) { st.maengel++; st[m.prio || 'mittel']++; }
    st.fotos += photosForRoom(r.id).length;
  }
  return st;
}

    c(st.maengel, `Mängel (${st.hoch} hoch)`, st.hoch ? 'var(--st-krit)' : 'var(--st-mangel)'), c(st.fotos, 'Fotos'));

async function saveFile(filename, data) {
  if (!RT.downloads) { toast('Download ist in dieser Ansicht nicht verfügbar.', 'error'); return false; }
  try {
    await RT.downloads.save({ filename, data });
    return true;
  } catch (e) {
    if (e?.code === 'declined') return false;
    if (e?.code === 'rate_limited') { toast('Bitte kurz warten und erneut versuchen.'); return false; }
    toast('Datei konnte nicht gespeichert werden: ' + (e?.message || e?.code || e), 'error', 6000);
    return false;
  }
}

async function uploadCover(files) {
  if (!RT.assets) { assetsUnavailable(); return; }
  const f = files && files[0];
  if (!f) return;
  const bb = busyBox('Titelbild wird gespeichert …');
  try {
    let src;
    try { src = await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch { src = await createImageBitmap(f); }
    const sc = Math.min(1, 2400 / Math.max(src.width, src.height));
    const c = document.createElement('canvas');
    c.width = Math.round(src.width * sc); c.height = Math.round(src.height * sc);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86));
    const res = await withTimeout(RT.assets.upload(blob, { type: 'image/jpeg' }), 120000, 'Upload dauert zu lange');
    const old = project()?.coverAssetId;
    patchDoc('projects/' + S.pid, { coverAssetId: res.id, updatedAt: Date.now() });
    if (old) RT.assets.delete(old).catch(() => {});
    toast('Titelbild gespeichert.', 'ok');
  } catch (e) {
    console.error(e);
    toast('Titelbild konnte nicht gespeichert werden' + (navigator.onLine ? ': ' + (e?.message || e?.code || e) : ' – keine Internetverbindung.'), 'error', 7000);
  } finally { bb.close(); }
}

const VIS_COLORS = { 'st-offen': '#7d8899', 'st-ok': '#2b9a55', 'st-mangel': '#e07a16', 'st-krit': '#d1352a', 'st-nz': '#7656c4' };
const REPORT_DEFAULTS = {
  title: 'Begehungsbericht', scope: 'all', gt: '', sw: '',
  cover: true, overview: true, defects: true, plans: true, details: true, excerpt: true, photos: true,
  perRow: 2, quality: 'standard', pageBreak: false,
};
function reportOpts() {
  try { return { ...REPORT_DEFAULTS, ...(JSON.parse(localStorage.getItem('begehung.report.' + S.pid) || '{}')) }; } catch { return { ...REPORT_DEFAULTS }; }
}
function saveReportOpts(o) { try { localStorage.setItem('begehung.report.' + S.pid, JSON.stringify(o)); } catch { /* ignore */ } }

function reportRooms(o) {
  return roomsSorted().filter((r) => {
    if (o.gt && r.gebaeudeteil !== o.gt) return false;
    if (o.sw && r.stockwerk !== o.sw) return false;
    if (o.scope === 'done' && !(r.status === 'begangen' || r.status === 'nz')) return false;
    if (o.scope === 'defects' && !(r.maengel || []).length) return false;
    return true;
  });
}
function scopeText(o) {
  const a = [{ all: 'Alle Räume', done: 'Erfasste Räume', defects: 'Räume mit Mängeln' }[o.scope] || 'Alle Räume'];
  if (o.gt) a.push('Gebäudeteil ' + o.gt);
  if (o.sw) a.push('Stockwerk ' + o.sw);
  return a.join(' · ');
}
function buildReportData(o) {
  const p = project();
  const rooms = reportRooms(o);
  let n = 0;
  const defects = [];
  const items = rooms.map((r) => {
    const ms = (r.maengel || []).map((m) => { const d = { ...m, no: 'M-' + String(++n).padStart(3, '0'), room: r }; defects.push(d); return d; });
    return { room: r, plan: S.plans.get(r.planId), defects: ms, photos: o.photos ? photosForRoom(r.id) : [] };
  });
  const defectsSorted = defects.slice().sort((a, b) => (PRIO_ORDER[a.prio] ?? 1) - (PRIO_ORDER[b.prio] ?? 1));
  // plan pages that contain reported rooms
  const pages = [];
  for (const pl of plansSorted()) for (let i = 0; i < (pl.pageCount || 1); i++) {
    const rs = rooms.filter((r) => r.planId === pl.id && (r.page || 0) === i);
    if (rs.length) pages.push({ plan: pl, page: i, rooms: rs });
  }
  const byGewerk = new Map();
  for (const d of defects) {
    const g = d.gewerk || 'ohne Gewerk';
    if (!byGewerk.has(g)) byGewerk.set(g, { hoch: 0, mittel: 0, gering: 0, total: 0 });
    const x = byGewerk.get(g); x[d.prio || 'mittel']++; x.total++;
  }
  return { p, o, rooms, items, defects, defectsSorted, pages, byGewerk, stats: projectStats(rooms), fields: fieldsDef(), date: new Date() };
}

// ---------- images ----------
function canvasJpeg(c, q = 0.85) {
  return new Promise((res, rej) => c.toBlob(async (b) => { if (!b) return rej(new Error('Bild konnte nicht erzeugt werden')); res(new Uint8Array(await b.arrayBuffer())); }, 'image/jpeg', q));
}
function drawRoomsOnCanvas(ctx, rooms, W, H, rg, scale, { highlight = null, labelSize = 14, line = 2, mode = 'overview' } = {}) {
  const tr = ([x, y]) => [(x * W - rg.x0) * scale, (y * H - rg.y0) * scale];
  const path = (r) => { ctx.beginPath(); r.pts.forEach((p, i) => { const [X, Y] = tr(p); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); };
  for (const r of rooms) {
    if (!r.pts || r.pts.length < 3 || r.id === highlight) continue;
    path(r);
    if (mode === 'overview') {
      const col = VIS_COLORS[roomVisualClass(r)];
      ctx.globalAlpha = 0.26; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = line; ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(70,80,95,.55)'; ctx.lineWidth = Math.max(1, line * 0.6); ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  if (highlight) {
    const r = rooms.find((x) => x.id === highlight);
    if (r?.pts?.length >= 3) {
      path(r);
      ctx.globalAlpha = 0.28; ctx.fillStyle = '#1f6fd1'; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#0a4a8f'; ctx.lineWidth = line * 1.8; ctx.stroke();
    }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const r of rooms) {
    if (!r.pts || r.pts.length < 3) continue;
    if (mode !== 'overview' && r.id !== highlight) continue;
    const [lx, ly] = tr(labelPoint(r.pts));
    const t = r.raumnr || r.raumname || '';
    if (!t) continue;
    ctx.font = `700 ${labelSize}px Arial, Helvetica, sans-serif`;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(3, labelSize / 4); ctx.strokeText(t, lx, ly);
    ctx.fillStyle = '#10243a'; ctx.fillText(t, lx, ly);
  }
}
async function renderPlanPage(plan, page, rooms, maxPx = 2400) {
  const src = await PlanSrc.page(plan, page);
  const W = src.W, H = src.H;
  let scale = maxPx / Math.max(W, H);
  if (W * H * scale * scale > 14e6) scale = Math.sqrt(14e6 / (W * H));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * scale)); c.height = Math.max(1, Math.round(H * scale));
  await src.render(c, scale, 0, 0).promise;
  const ctx = c.getContext('2d');
  drawRoomsOnCanvas(ctx, rooms, W, H, { x0: 0, y0: 0 }, scale, { labelSize: Math.max(13, Math.round(c.width / 150)), line: Math.max(2, c.width / 1200) });
  return { bytes: await canvasJpeg(c, 0.86), w: c.width, h: c.height };
}
async function renderExcerpt(plan, page, room, allRooms, outPx = 900) {
  const src = await PlanSrc.page(plan, page);
  const W = src.W, H = src.H;
  const b = polyBBox(room.pts.map(([x, y]) => [x * W, y * H]));
  const m = Math.max(b.w, b.h) * 0.55 + Math.min(W, H) * 0.03;
  let x0 = b.x0 - m, x1 = b.x1 + m, y0 = b.y0 - m, y1 = b.y1 + m;
  // aspect 4:3

async function photoForReport(ph, maxPx) {

}
async function logoForReport(p) {
  if (!p.logoAssetId) return null;
  try {
    const bmp = await createImageBitmap(await PLATFORM.fetchBlob(p.logoAssetId));
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0);

}

// Collect all images once (shared by PDF and Word)
async function collectImages(d, progress) {
  const o = d.o;
  const img = { logo: null, cover: null, pages: new Map(), excerpts: new Map(), photos: new Map(), missing: 0 };
  img.logo = await logoForReport(d.p);
  if (o.cover && d.p.coverAssetId) {
    progress('Titelbild wird vorbereitet …');
    try { img.cover = await photoForReport({ assetId: d.p.coverAssetId }, 1800); } catch (e) { console.warn(e); img.missing++; }
  }
  const maxPh = o.quality === 'compact' ? 1000 : 1400;
  if (o.plans) {
    let i = 0;
    for (const pg of d.pages) {
      progress(`Planübersicht ${++i}/${d.pages.length} wird gerendert …`);
      try { img.pages.set(pg.plan.id + '|' + pg.page, await renderPlanPage(pg.plan, pg.page, [...S.rooms.values()].filter((r) => r.planId === pg.plan.id && (r.page || 0) === pg.page))); }
      catch (e) { console.warn(e); img.missing++; }
    }
  }
  if (o.details) {
    let i = 0;
    const totalPh = d.items.reduce((n, it) => n + it.photos.length, 0);
    let np = 0;
    for (const it of d.items) {
      i++;
      if (o.excerpt && it.plan) {
        progress(`Raum ${i}/${d.items.length}: Planausschnitt …`);
        try {
          const others = [...S.rooms.values()].filter((r) => r.planId === it.room.planId && (r.page || 0) === (it.room.page || 0));
          img.excerpts.set(it.room.id, await renderExcerpt(it.plan, it.room.page || 0, it.room, others));
        } catch (e) { console.warn(e); img.missing++; }
      }
      for (const ph of it.photos) {
        progress(`Foto ${++np}/${totalPh} wird vorbereitet …`);
        try { img.photos.set(ph.id, await photoForReport(ph, maxPh)); } catch (e) { console.warn(e); img.missing++; }
      }
    }
  }
  return img;
}

const PDF_MAP = { '≤': '<=', '≥': '>=', '→': '->', '←': '<-', '✓': 'x', '✔': 'x', '×': 'x', '\t': ' ', ' ': ' ', 'ℓ': 'l', '·': '·', '⌀': 'Ø', 'Ø': 'Ø', '±': '±', '°': '°', '³': '³' };

  const PRIO_C = { hoch: hex('#c2352b'), mittel: hex('#c46a0c'), gering: hex('#9a7a12') };

    text(t, { size = 10, bold = false, color = C.ink, x = M.l, w = null, lh = 1.35, after = 4 } = {}) {

      }
      if (o.photos && it.photos.length) {
        W.text(`Fotos (${it.photos.length})`, { size: 9.5, bold: true, after: 5 });
        const per = o.perRow === 3 ? 3 : 2, gap = 10;
        const cellW = (W.cw - gap * (per - 1)) / per;
        const maxH = per === 3 ? 125 : 185;
        for (let k = 0; k < it.photos.length; k += per) {
          const row = it.photos.slice(k, k + per);
          const dims = row.map((ph) => { const im = img.photos.get(ph.id); return im ? sizeFit(im, cellW, maxH) : [cellW, 40]; });
          const caps = row.map((ph, j) => W.wrap(`Foto ${k + j + 1}${ph.caption ? ': ' + ph.caption : ''}`, F, 8.3, cellW));
          const rowH = Math.max(...dims.map((x) => x[1])) + 4 + Math.max(...caps.map((c) => c.length)) * 10.5 + 8;
          W.ensure(rowH);
          for (let j = 0; j < row.length; j++) {
            const x = M.l + j * (cellW + gap);
            const im = img.photos.get(row[j].id);
            if (im) await W.image(im, dims[j][0], dims[j][1], x);
            else W.page.drawText('Foto nicht verfügbar', { x, y: W.y - 20, size: 8.5, font: F, color: C.muted });
            caps[j].forEach((ln, q) => W.page.drawText(ln, { x, y: W.y - dims[j][1] - 12 - q * 10.5, size: 8.3, font: F, color: C.muted }));
          }
          W.y -= rowH;
        }
      }
      W.y -= 10;
      if (!o.pageBreak) { W.ensure(30); W.rule(); W.y -= 4; }
    }
  }
  // ---------- footer ----------
  const pages = doc.getPages();
  const n = pages.length;
  const foot = clean(`${p.name || ''} – ${o.title || 'Begehungsbericht'}`);
  pages.forEach((pg, i) => {
    if (o.cover && i === 0) return;
    const { width } = pg.getSize();
    pg.drawLine({ start: { x: M.l, y: 38 }, end: { x: width - M.r, y: 38 }, thickness: 0.5, color: C.line });
    const left = foot.length > 90 ? foot.slice(0, 88) + '…' : foot;
    pg.drawText(left, { x: M.l, y: 26, size: 8, font: F, color: C.muted });
    const t = `Seite ${i + 1} von ${n}`;
    pg.drawText(t, { x: width - M.r - F.widthOfTextAtSize(t, 8), y: 26, size: 8, font: F, color: C.muted });
  });
  progress('PDF wird gespeichert …');
  return doc.save();
}

// ======================================================================
// Word via docx
// ======================================================================
async function buildDocx(d, img, progress) {
  const D = await loadScript(LIB.docx, 'docx');
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, ImageRun, AlignmentType, Footer, PageNumber, ShadingType, BorderStyle, PageBreak } = D;
  const p = d.p, o = d.o;
  const PX = 643; // content width in px at 96 dpi (A4, 2 cm margins)
  const T = (text, opt = {}) => new TextRun({ text: String(text ?? ''), ...opt });
  const P = (text, opt = {}) => {
    const lines = String(text ?? '').split('\n');
    const children = [];
    lines.forEach((ln, i) => children.push(new TextRun({ text: ln, break: i ? 1 : 0, bold: opt.bold, color: opt.color, size: opt.size, italics: opt.italics })));
    return new Paragraph({ children, spacing: { after: opt.after ?? 80 }, heading: opt.heading, alignment: opt.align, pageBreakBefore: opt.pageBreak, keepNext: opt.keepNext });
  };
  const border = { style: BorderStyle.SINGLE, size: 4, color: 'D5DAE1' };
  const borders = { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border };
  const noB = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
  const noBorders = { top: noB, bottom: noB, left: noB, right: noB, insideHorizontal: noB, insideVertical: noB };
  const cell = (content, { w, fill, bold, color, size = 18, align } = {}) => new TableCell({
    width: w ? { size: w, type: WidthType.PERCENTAGE } : undefined,
    shading: fill ? { fill, type: ShadingType.CLEAR, color: 'auto' } : undefined,
    margins: { top: 50, bottom: 50, left: 80, right: 80 },
    children: Array.isArray(content) ? content : [new Paragraph({ alignment: align, children: String(content ?? '').split('\n').map((ln, i) => new TextRun({ text: ln, break: i ? 1 : 0, bold, color, size })) })],
  });
  const table = (cols, rows, { header = true, size = 17, plain = false } = {}) => new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    borders: plain ? noBorders : borders,
    rows: [
      ...(header ? [new TableRow({ tableHeader: true, children: cols.map((c) => cell(c.label, { w: Math.round(c.w * 100), fill: 'EEF1F4', bold: true, color: '5B6676', size })) })] : []),
      ...rows.map((r) => new TableRow({ cantSplit: true, children: r.map((v, i) => { const c = v && typeof v === 'object' ? v : { t: v }; return cell(c.t, { w: Math.round(cols[i].w * 100), bold: c.bold, color: c.color, size, align: cols[i].align === 'center' ? AlignmentType.CENTER : undefined }); }) })),
    ],
  });
  const image = (im, maxW, maxH) => { const sc = Math.min(maxW / im.w, maxH / im.h, 1e9); return new ImageRun({ type: 'jpg', data: im.bytes, transformation: { width: Math.round(im.w * sc), height: Math.round(im.h * sc) } }); };
  const PRIO_HEX = { hoch: 'C2352B', mittel: 'C46A0C', gering: '9A7A12' };
  const ST_HEX = { offen: '5B6676', begangen: '1D7A41', nz: '5B3FA6' };
  const children = [];
  let sec = 0;
  const H1 = (t, first) => { sec++; children.push(new Paragraph({ heading: HeadingLevel.HEADING_1, pageBreakBefore: !first || o.cover, children: [T(`${sec}  ${t}`)], spacing: { after: 160 } })); };

  if (o.cover) {
    progress('Word: Deckblatt …');
    if (img.logo) children.push(new Paragraph({ alignment: AlignmentType.RIGHT, children: [image(img.logo, 200, 70)], spacing: { after: img.cover ? 300 : 600 } }));
    else children.push(P('', { after: img.cover ? 300 : 600 }));
    children.push(P(o.title || 'Begehungsbericht', { bold: true, size: 52, after: 120 }));
    children.push(P(p.name || '', { size: 30, after: 60 }));
    if (p.objekt || p.adresse) children.push(P([p.objekt, p.adresse].filter(Boolean).join(' · '), { size: 23, color: '5B6676', after: 360 }));
    if (img.cover) children.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [image(img.cover, PX, 440)], spacing: { after: 300 } }));
    const info = [['Auftraggeber', p.auftraggeber], ['Datum der Begehung', fmtDay(p.datum)], ['Teilnehmende', p.teilnehmer], ['Erstellt von', p.ersteller], ['Berichtsdatum', d.date.toLocaleDateString('de-DE')], ['Umfang', scopeText(o)]].filter(([, v]) => v);
    children.push(table([{ w: 0.3 }, { w: 0.7 }], info.map(([k, v]) => [{ t: k, color: '5B6676' }, v]), { header: false, size: 20, plain: true }));
    if (img.cover) children.push(new Paragraph({ heading: HeadingLevel.HEADING_1, pageBreakBefore: true, children: [T('Zusammenfassung')], spacing: { after: 160 } }));
    if (p.anlass) { children.push(P('Anlass und Ziel', { heading: HeadingLevel.HEADING_2 })); children.push(P(p.anlass)); }
    children.push(P(img.cover ? 'Ergebnisse der Begehung' : 'Zusammenfassung', { heading: HeadingLevel.HEADING_2 }));
    const st = d.stats;
    children.push(table(['Räume', 'begangen', 'offen', 'nicht zugänglich', 'Mängel', 'Fotos'].map((l) => ({ label: l, w: 1 / 6, align: 'center' })),
      [[st.total, st.begangen, st.offen, st.nz, st.maengel, st.fotos].map((v) => ({ t: String(v), bold: true }))], { size: 20 }));
    children.push(P(''));
    if (d.defects.length) {
      children.push(P(`Mängel nach Priorität: ${st.hoch} hoch · ${st.mittel} mittel · ${st.gering} gering`));
      children.push(table([{ label: 'Gewerk', w: 0.48 }, { label: 'hoch', w: 0.13, align: 'center' }, { label: 'mittel', w: 0.13, align: 'center' }, { label: 'gering', w: 0.13, align: 'center' }, { label: 'gesamt', w: 0.13, align: 'center' }],
        [...d.byGewerk].sort((a, b) => b[1].total - a[1].total).map(([g, x]) => [g, { t: String(x.hoch || ''), color: PRIO_HEX.hoch }, { t: String(x.mittel || ''), color: PRIO_HEX.mittel }, { t: String(x.gering || ''), color: PRIO_HEX.gering }, { t: String(x.total), bold: true }])));
    } else children.push(P('Es wurden keine Mängel erfasst.'));
  }
  let first = !o.cover;
  if (o.overview) {
    H1('Raumübersicht', first); first = false;
    children.push(P(`${d.rooms.length} Räume · ${scopeText(o)}`, { color: '5B6676' }));
    children.push(table([
      { label: 'Gebäudeteil', w: 0.13 }, { label: 'Stockwerk', w: 0.11 }, { label: 'Nr.', w: 0.08 }, { label: 'Bezeichnung', w: 0.18 }, { label: 'Nutzung', w: 0.13 },
      { label: 'Status', w: 0.12 }, { label: 'Zustand', w: 0.09 }, { label: 'Mängel', w: 0.085, align: 'center' }, { label: 'Fotos', w: 0.075, align: 'center' },
    ], d.items.map(({ room: r, defects }) => [r.gebaeudeteil, r.stockwerk, { t: r.raumnr, bold: true }, r.raumname, r.nutzung,
      { t: STATUS[r.status || 'offen'].label, color: ST_HEX[r.status || 'offen'] }, ZUSTAND[r.zustand || ''] === '–' ? '' : ZUSTAND[r.zustand || ''],
      { t: defects.length ? String(defects.length) : '', bold: true, color: defects.some((m) => m.prio === 'hoch') ? PRIO_HEX.hoch : undefined }, String(photosForRoom(r.id).length || '')])));
  }
  if (o.defects) {
    H1('Mängelliste', first); first = false;
    if (!d.defectsSorted.length) children.push(P('Keine Mängel erfasst.'));
    else children.push(table([{ label: 'Nr.', w: 0.09 }, { label: 'Raum', w: 0.22 }, { label: 'Gewerk', w: 0.16 }, { label: 'Beschreibung', w: 0.43 }, { label: 'Priorität', w: 0.1 }],
      d.defectsSorted.map((m) => [{ t: m.no, bold: true }, [roomTitle(m.room), [m.room.gebaeudeteil, m.room.stockwerk].filter(Boolean).join(' · ')].filter(Boolean).join('\n'), m.gewerk || '', m.text || '(ohne Beschreibung)', { t: PRIO[m.prio || 'mittel'], bold: true, color: PRIO_HEX[m.prio || 'mittel'] }])));
  }
  if (o.plans && d.pages.length) {
    H1('Planübersichten', first); first = false;
    d.pages.forEach((pg, i) => {
      const im = img.pages.get(pg.plan.id + '|' + pg.page);
      const lbl = pageLabel(pg.plan, pg.page);
      children.push(P(pg.plan.name + (lbl ? ' – ' + lbl : ''), { bold: true, pageBreak: i > 0, keepNext: true }));
      if (im) children.push(new Paragraph({ children: [image(im, PX, 820)], spacing: { after: 120 } }));
    });
    children.push(P('Farben: grau = offen · grün = begangen · orange = mit Mängeln · rot = Mangel hoch · violett = nicht zugänglich', { size: 16, color: '5B6676' }));
  }
  if (o.details) {
    H1('Raumdetails', first); first = false;
    let i = 0;
    for (const it of d.items) {
      const r = it.room;
      progress(`Word: Raum ${++i}/${d.items.length} …`);
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, pageBreakBefore: o.pageBreak && i > 1, keepNext: true, children: [T(roomTitle(r)), T('   ' + STATUS[r.status || 'offen'].label, { color: ST_HEX[r.status || 'offen'], size: 20 })] }));
      const sub = roomSub(r);
      if (sub) children.push(P(sub, { color: '5B6676', after: 100 }));
      const kv = [['Zustand', ZUSTAND[r.zustand || ''] === '–' ? '–' : ZUSTAND[r.zustand || '']]];
      for (const f of d.fields) { const v = r.values?.[f.id]; if (v != null && v !== '') kv.push([f.label, String(v)]); }
      if (r.inspectedAt) kv.push(['Erfasst am', fmtDateTime(r.inspectedAt)]);
      if (it.plan) kv.push(['Plan', it.plan.name + ((it.plan.pageCount || 1) > 1 ? `, Seite ${(r.page || 0) + 1}` : '')]);
      const kvTable = table([{ w: 0.42 }, { w: 0.58 }], kv.map(([k, v]) => [{ t: k, color: '5B6676' }, v]), { header: false, size: 18 });
      const ex = img.excerpts.get(r.id);
      if (ex) {
        children.push(new Table({
          width: { size: 100, type: WidthType.PERCENTAGE }, borders: noBorders,
          rows: [new TableRow({ children: [
            new TableCell({ width: { size: 58, type: WidthType.PERCENTAGE }, children: [kvTable, new Paragraph({ children: [] })], margins: { right: 120 } }),
            new TableCell({ width: { size: 42, type: WidthType.PERCENTAGE }, children: [new Paragraph({ alignment: AlignmentType.RIGHT, children: [image(ex, 260, 200)] })] }),
          ] })],
        }));
      } else children.push(kvTable);
      if (r.notes) { children.push(P('Bemerkungen', { bold: true, after: 40 })); children.push(P(r.notes)); }
      if (it.defects.length) {
        children.push(P('Mängel', { bold: true, after: 40, keepNext: true }));
        children.push(table([{ label: 'Nr.', w: 0.1 }, { label: 'Gewerk', w: 0.2 }, { label: 'Beschreibung', w: 0.56 }, { label: 'Priorität', w: 0.14 }],
          it.defects.map((m) => [{ t: m.no, bold: true }, m.gewerk || '', m.text || '(ohne Beschreibung)', { t: PRIO[m.prio || 'mittel'], bold: true, color: PRIO_HEX[m.prio || 'mittel'] }])));
      }
      if (o.photos && it.photos.length) {
        children.push(P(`Fotos (${it.photos.length})`, { bold: true, after: 60, keepNext: true }));
        const per = o.perRow === 3 ? 3 : 2;
        const cw = Math.floor((PX - (per - 1) * 12) / per);
        const rows = [];
        for (let k = 0; k < it.photos.length; k += per) {
          const row = it.photos.slice(k, k + per);
          const cells = row.map((ph, j) => {
            const im = img.photos.get(ph.id);
            return new TableCell({
              width: { size: Math.floor(100 / per), type: WidthType.PERCENTAGE }, margins: { top: 60, bottom: 60, left: 40, right: 40 },
              children: [
                im ? new Paragraph({ children: [image(im, cw - 10, per === 3 ? 170 : 250)] }) : P('Foto nicht verfügbar', { color: '5B6676' }),
                P(`Foto ${k + j + 1}${ph.caption ? ': ' + ph.caption : ''}`, { size: 16, color: '5B6676', after: 0 }),
              ],
            });
          });
          while (cells.length < per) cells.push(new TableCell({ width: { size: Math.floor(100 / per), type: WidthType.PERCENTAGE }, children: [P('')] }));
          rows.push(new TableRow({ cantSplit: true, children: cells }));
        }
        children.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, borders: noBorders, rows }));
      }
      children.push(P('', { after: 200 }));
    }
  }
  const doc = new Document({
    creator: p.ersteller || 'Begehungs-App', title: `${o.title} – ${p.name}`, description: 'Begehungsbericht',
    styles: {
      default: { document: { run: { font: 'Arial', size: 20, color: '18212D' } } },
      paragraphStyles: [
        { id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { size: 32, bold: true, color: '0B6B61' }, paragraph: { spacing: { before: 240, after: 160 } } },
        { id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { size: 25, bold: true, color: '18212D' }, paragraph: { spacing: { before: 280, after: 80 } } },
      ],
    },
    sections: [{
      properties: { titlePage: !!o.cover, page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 } } },
      footers: {
        first: new Footer({ children: [new Paragraph({ children: [] })] }),
        default: new Footer({ children: [new Paragraph({ alignment: AlignmentType.RIGHT, children: [
          new TextRun({ text: `${p.name || ''} – ${o.title || 'Begehungsbericht'}    `, size: 15, color: '7A8494' }),
          new TextRun({ children: ['Seite ', PageNumber.CURRENT, ' von ', PageNumber.TOTAL_PAGES], size: 15, color: '7A8494' }),
        ] })] }),
      },
      children,
    }],
  });
  progress('Word-Datei wird gespeichert …');
  return Packer.toBlob(doc);
}

function defectsCSV(d) {
  const rows = [['Nr.', 'Gebäudeteil', 'Stockwerk', 'Raum-Nr.', 'Raumbezeichnung', 'Gewerk', 'Beschreibung', 'Priorität', 'Raumstatus', 'Erfasst am']];
  for (const m of d.defectsSorted) rows.push([m.no, m.room.gebaeudeteil, m.room.stockwerk, m.room.raumnr, m.room.raumname, m.gewerk, m.text, PRIO[m.prio || 'mittel'], STATUS[m.room.status || 'offen'].label, fmtDateTime(m.ts || m.room.inspectedAt)]);
  return toCSV(rows);
}

// ======================================================================
// Report tab
// ======================================================================
function renderReportTab(main) {
  const o = reportOpts();
  const inner = h('div', { class: 'page-inner' });
  main.append(h('div', { class: 'page' }, inner));
  const statsBox = h('div');
  const status = h('div');
  const coverBox = h('div');
  const renderCover = () => { const p = project(); if (p) coverBox.replaceChildren(coverCard(p)); };
  renderCover();
  const title = h('input', { type: 'text', value: o.title });
  const scope = h('select', null, h('option', { value: 'all' }, 'Alle Räume'), h('option', { value: 'done' }, 'Nur erfasste Räume (begangen / nicht zugänglich)'), h('option', { value: 'defects' }, 'Nur Räume mit Mängeln'));
  scope.value = o.scope;
  const uniq = (k) => [...new Set([...S.rooms.values()].map((r) => r[k]).filter(Boolean))].sort(natCmp);
  const gt = h('select', null, h('option', { value: '' }, 'Alle Gebäudeteile'), uniq('gebaeudeteil').map((v) => h('option', { value: v }, v)));
  const sw = h('select', null, h('option', { value: '' }, 'Alle Stockwerke'), uniq('stockwerk').map((v) => h('option', { value: v }, v)));
  gt.value = o.gt; sw.value = o.sw;
  const chk = (key, label) => { const c = h('input', { type: 'checkbox', checked: !!o[key] }); c.addEventListener('change', () => { o[key] = c.checked; persist(); }); return h('label', { class: 'fld check' }, c, label); };
  const perRow = h('select', null, h('option', { value: '2' }, '2 Fotos pro Zeile'), h('option', { value: '3' }, '3 Fotos pro Zeile'));
  perRow.value = String(o.perRow);
  const quality = h('select', null, h('option', { value: 'standard' }, 'Fotoqualität: Standard'), h('option', { value: 'compact' }, 'Fotoqualität: kompakt (kleinere Datei)'));
  quality.value = o.quality;
  const persist = () => {
    Object.assign(o, { title: title.value.trim() || 'Begehungsbericht', scope: scope.value, gt: gt.value, sw: sw.value, perRow: +perRow.value, quality: quality.value });
    saveReportOpts(o);
    renderStats();
  };
  [title, scope, gt, sw, perRow, quality].forEach((el) => el.addEventListener('change', persist));
  const renderStats = () => {
    const rs = reportRooms(o);
    statsBox.replaceChildren(statCards(projectStats(rs)));
  };
  let running = false;
  const run = async (kind) => {
    if (running) return;
    persist();
    const d = buildReportData(o);
    if (!d.rooms.length && kind !== 'csv') { toast('Für diese Auswahl gibt es keine Räume.'); return; }
    if (kind === 'csv') {
      if (!d.defects.length) { toast('Keine Mängel in dieser Auswahl.'); return; }
      await saveFile(`${safeName(d.p.name)} – Mängelliste.csv`, defectsCSV(d));
      return;
    }
    running = true;
    const msg = h('span', null, 'Bericht wird vorbereitet …');
    status.replaceChildren(h('div', { class: 'progress' }, h('div', { class: 'spinner' }), msg));
    const progress = (t) => { msg.textContent = t; };
    try {
      if (PQ.items.size) toast(`${PQ.items.size} Foto(s) sind noch nicht hochgeladen – sie werden aus dem lokalen Speicher übernommen.`, '', 5000);
      const img = await collectImages(d, progress);
      const stamp = todayISO();
      let data, ext;
      if (kind === 'pdf') { data = await buildPdf(d, img, progress); ext = 'pdf'; }
      else { data = await buildDocx(d, img, progress); ext = 'docx'; }
      const size = data.byteLength ?? data.size;
      const fname = `${safeName(d.p.name)} – ${safeName(o.title)} ${stamp}.${ext}`;
      progress('Datei wird übergeben …');
      const ok = await saveFile(fname, data instanceof Uint8Array ? new Blob([data], { type: 'application/pdf' }) : data);
      status.replaceChildren(h('div', { class: 'progress' }, ok ? `✓ ${fname} (${fmtBytes(size)})` : 'Speichern abgebrochen.',
        img.missing ? h('span', { class: 'badge warn' }, `${img.missing} Bild(er) fehlten`) : null));
    } catch (e) {
      console.error(e);
      status.replaceChildren(h('div', { class: 'progress', style: { color: 'var(--danger)' } }, 'Fehler: ' + (e?.message || e)));
    } finally { running = false; }
  };
  inner.append(
    h('h1', null, 'Bericht'),
    statsBox,
    h('div', { class: 'card section' },
      h('h2', null, 'Umfang'),
      h('div', { class: 'grid2' },
        h('label', { class: 'fld span2' }, 'Titel', title),
        h('label', { class: 'fld span2' }, 'Räume', scope),
        h('label', { class: 'fld' }, 'Gebäudeteil', gt),
        h('label', { class: 'fld' }, 'Stockwerk', sw))),
    h('div', { class: 'card section' },
      h('h2', null, 'Inhalte'),
      h('div', { class: 'grid2' },
        chk('cover', 'Deckblatt mit Zusammenfassung'), chk('overview', 'Raumübersicht (Tabelle)'),
        chk('defects', 'Mängelliste'), chk('plans', 'Planübersichten mit eingefärbten Räumen'),
        chk('details', 'Raumdetails'), chk('excerpt', 'Planausschnitt je Raum'),
        chk('photos', 'Fotos'), chk('pageBreak', 'Jeder Raum auf neuer Seite'),
        h('label', { class: 'fld' }, 'Fotos', perRow), h('label', { class: 'fld' }, 'Dateigröße', quality))),
    coverBox,
    h('div', { class: 'card section' },
      h('h2', null, 'Erstellen'),
      h('div', { class: 'row' },
        btn('PDF erstellen', { icon: 'file', kind: 'primary', onClick: () => run('pdf') }),
