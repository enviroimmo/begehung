async function exportBackup() {
  const p = project();
  if (!p) return;
  const bb = busyBox('Sicherung wird erstellt …');
  try {
    const JSZip = await loadScript(LIB.jszip, 'JSZip');
    const zip = new JSZip();
    const files = {};
    const strip = ({ id, ...rest }) => ({ id, ...rest });
    const photos = [...S.photos.values()].map(strip);
    let i = 0;
    for (const pl of S.plans.values()) {
      bb.set(`Plan ${++i}/${S.plans.size} …`);
      const buf = await PlanSrc.bytes(pl);
      const ext = pl.kind === 'image' ? (pl.mime === 'image/png' ? 'png' : pl.mime === 'image/webp' ? 'webp' : 'jpg') : 'pdf';
      const path = `plaene/${pl.id}.${ext}`;
      zip.file(path, buf);
      files[pl.assetId] = { path, type: pl.kind === 'image' ? pl.mime : 'application/pdf' };
    }
    i = 0;
    for (const ph of photos) {
      bb.set(`Foto ${++i}/${photos.length} …`);
      try {
        const b = await PLATFORM.fetchBlob(ph.assetId);
        const path = `fotos/${ph.id}.jpg`;
        zip.file(path, b);
        files[ph.assetId] = { path, type: 'image/jpeg' };
      } catch { /* skip missing */ }
    }
    for (const pend of [...PQ.items.values()].filter((x) => x.pid === p.id)) {
      const key = 'pending:' + pend.id;
      const path = `fotos/${pend.id}.jpg`;
      zip.file(path, pend.blob);
      files[key] = { path, type: 'image/jpeg' };
      photos.push({ id: pend.id, roomId: pend.roomId, assetId: key, caption: pend.caption || '', ts: pend.ts, w: pend.w, h: pend.h });
    }
    if (p.coverAssetId) {
      try { zip.file('titelbild.jpg', await PLATFORM.fetchBlob(p.coverAssetId)); files[p.coverAssetId] = { path: 'titelbild.jpg', type: 'image/jpeg' }; } catch { /* ignore */ }
    }
    if (p.logoAssetId) {
      try { zip.file('logo.png', await PLATFORM.fetchBlob(p.logoAssetId)); files[p.logoAssetId] = { path: 'logo.png', type: 'image/png' }; } catch { /* ignore */ }
    }
    const data = { format: 'begehung-backup', version: 1, exportedAt: new Date().toISOString(), project: strip(p), plans: [...S.plans.values()].map(strip), rooms: [...S.rooms.values()].map(strip), photos, files };
    zip.file('projekt.json', JSON.stringify(data, null, 1));
    bb.set('ZIP wird gepackt …');
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    bb.close();
    await saveFile(`${safeName(p.name)} – Sicherung ${todayISO()}.zip`, blob);
  } catch (e) {
    bb.close();
    console.error(e);
    toast('Sicherung fehlgeschlagen: ' + (e?.message || e), 'error', 7000);
  }
}

async function importBackup(files) {
  if (!RT.assets) { assetsUnavailable(); return; }
  const f = files && files[0];
  if (!f) return;
  const bb = busyBox('Sicherung wird gelesen …');
  try {
    const JSZip = await loadScript(LIB.jszip, 'JSZip');
    const zip = await JSZip.loadAsync(f);
    const jf = zip.file('projekt.json');
    if (!jf) throw new Error('Keine gültige Sicherung (projekt.json fehlt).');
    const data = JSON.parse(await jf.async('string'));
    if (data.format !== 'begehung-backup') throw new Error('Unbekanntes Dateiformat.');
    const assetMap = new Map();
    const up = async (oldId) => {
      if (!oldId) return null;
      if (assetMap.has(oldId)) return assetMap.get(oldId);
      const meta = data.files?.[oldId];
      const zf = meta && zip.file(meta.path);
      if (!zf) return null;
      const blob = new Blob([await zf.async('arraybuffer')], { type: meta.type });
      const res = await withTimeout(RT.assets.upload(blob, { type: meta.type }), 300000);
      assetMap.set(oldId, res.id);
      return res.id;
    };
    const pid = uid('p');
    const names = new Set([...S.projects.values()].map((x) => x.name));
    const { id: _o, ...proj } = data.project;
    if (names.has(proj.name)) proj.name += ' (Import)';
    bb.set('Logo und Pläne werden hochgeladen …');
    proj.logoAssetId = await up(proj.logoAssetId);
    proj.coverAssetId = await up(proj.coverAssetId);
    const planIds = new Map(), roomIds = new Map();
    const docs = [];
    let i = 0;
    for (const pl of data.plans || []) {
      bb.set(`Plan ${++i}/${data.plans.length} wird hochgeladen …`);
      const { id, ...rest } = pl;
      const nid = uid('pl');
      planIds.set(id, nid);
      rest.assetId = await up(pl.assetId);
      if (!rest.assetId) continue;
      docs.push([`projects/${pid}/plans/${nid}`, rest]);
    }
    for (const r of data.rooms || []) {
      const { id, ...rest } = r;
      if (!planIds.has(r.planId)) continue;
      const nid = uid('r');
      roomIds.set(id, nid);
      rest.planId = planIds.get(r.planId);
      docs.push([`projects/${pid}/rooms/${nid}`, rest]);
    }
    i = 0;
    for (const ph of data.photos || []) {
      bb.set(`Foto ${++i}/${data.photos.length} wird hochgeladen …`);
      if (!roomIds.has(ph.roomId)) continue;
      const { id, ...rest } = ph;
      rest.roomId = roomIds.get(ph.roomId);
      rest.assetId = await up(ph.assetId);
      if (!rest.assetId) continue;
      docs.push([`projects/${pid}/photos/${uid('ph')}`, rest]);
    }
    saveDoc('projects/' + pid, { ...proj, updatedAt: Date.now() });
    for (const [path, doc] of docs) Q.put(path, 'set', doc);
    bb.close();
    toast(`„${proj.name}“ importiert: ${planIds.size} ${planIds.size === 1 ? 'Plan' : 'Pläne'}, ${roomIds.size} ${roomIds.size === 1 ? 'Raum' : 'Räume'}.`, 'ok', 5000);
  } catch (e) {
    bb.close();
    console.error(e);
    toast('Import fehlgeschlagen: ' + (e?.message || e?.code || e), 'error', 8000);
  }
}

function waitFor(cond, ms) {
  return new Promise((res) => {
    if (cond()) return res(true);
    const t = setTimeout(() => { off(); res(false); }, ms);
    const off = onData(() => { if (cond()) { clearTimeout(t); off(); res(true); } });
  });
}

// ======================================================================
// OneDrive (Microsoft 365) sync: sign-in with PKCE, Microsoft Graph, per-project merge
// ======================================================================
const CLOUD_FILE = 'begehung-daten.json';
const DOC_FOLDER = 'Begehungsdokumentation';
const PHOTO_FOLDER = 'Fotos';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { /* ignore */ } };
function CFG() {
  const c = window.BEGEHUNG_CONFIG || {};
  return {
    clientId: (lsGet('begehung.cfg.clientId') || c.clientId || '').trim(),
    tenantId: (lsGet('begehung.cfg.tenantId') || c.tenantId || '').trim() || 'organizations',
    folder: (c.oneDriveFolder || 'Begehungs-App').trim(),
  };
}
const SCOPES = 'openid profile offline_access User.Read Files.ReadWrite';
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const safeFile = (s) => String(s || '').replace(/[\\/:*?"<>|#%&{}~]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 90) || 'Datei';
const enc = (rel) => rel.split('/').map(encodeURIComponent).join('/');
const itemPath = (id, rel) => `/me/drive/items/${id}:/${enc(rel)}:`;

// ---------- authentication (authorization code flow with PKCE, no secret) ----------
const Auth = {
  t: null,
  load() { try { this.t = JSON.parse(lsGet('begehung.auth') || 'null'); } catch { this.t = null; } },
  save() { lsSet('begehung.auth', this.t ? JSON.stringify(this.t) : null); },
  redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  authority() { return `https://login.microsoftonline.com/${encodeURIComponent(CFG().tenantId)}/oauth2/v2.0`; },
  async login() {
    if (!CFG().clientId) { Cloud.setupDialog(); return; }
    if (!navigator.onLine) { toast('Für die Anmeldung wird eine Internetverbindung benötigt.'); return; }
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
    lsSet('begehung.pkce', JSON.stringify({ verifier, state, ts: Date.now() }));
    const p = new URLSearchParams({
      client_id: CFG().clientId, response_type: 'code', redirect_uri: this.redirectUri(), response_mode: 'query',
      scope: SCOPES, state, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account',
    });
    if (this.t?.username) p.set('login_hint', this.t.username);
    location.assign(this.authority() + '/authorize?' + p.toString());
  },
  async handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    history.replaceState(null, '', this.redirectUri());
    if (q.has('error')) { setTimeout(() => toast('Anmeldung fehlgeschlagen: ' + (q.get('error_description') || q.get('error')), 'error', 10000), 500); return; }
    let saved = null;
    try { saved = JSON.parse(lsGet('begehung.pkce') || 'null'); } catch { /* ignore */ }
    lsSet('begehung.pkce', null);
    if (!saved || saved.state !== q.get('state')) { setTimeout(() => toast('Anmeldung abgebrochen – bitte erneut versuchen.', 'error', 7000), 500); return; }
    try {
      await this.token({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: this.redirectUri(), code_verifier: saved.verifier });
      const me = await G.req('GET', '/me?$select=displayName,mail,userPrincipalName');
      this.t.name = me.displayName || ''; this.t.username = me.mail || me.userPrincipalName || '';
      this.t.needsLogin = false;
      this.save();
      Cloud.justLoggedIn = true;
    } catch (e) {
      console.error(e);
      setTimeout(() => toast('Anmeldung fehlgeschlagen: ' + (e.message || e), 'error', 10000), 500);
    }
  },
  async token(params) {
    const body = new URLSearchParams({ client_id: CFG().clientId, scope: SCOPES, ...params });
    const r = await withTimeout(fetch(this.authority() + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body }), 30000, 'Anmeldedienst antwortet nicht');
    let j = {};
    try { j = await r.json(); } catch { /* ignore */ }
    if (!r.ok) { const e = new Error(j.error_description || j.error || 'Anmeldung fehlgeschlagen'); e.code = j.error; throw e; }
    this.t = { ...(this.t || {}), access: j.access_token, refresh: j.refresh_token || this.t?.refresh, exp: Date.now() + ((j.expires_in || 3600) - 120) * 1000 };
    this.save();
  },
  async accessToken(force) {
    if (!this.t || this.t.needsLogin) throw { code: 'login_required', message: 'Nicht bei OneDrive angemeldet' };
    if (!force && this.t.access && Date.now() < this.t.exp) return this.t.access;
    if (!this.t.refresh) { this.t.needsLogin = true; this.save(); throw { code: 'login_required', message: 'Anmeldung abgelaufen' }; }
    try { await this.token({ grant_type: 'refresh_token', refresh_token: this.t.refresh }); }
    catch (e) {
      if (e.code && e.code !== 'temporarily_unavailable') { this.t.needsLogin = true; this.save(); throw { code: 'login_required', message: 'Anmeldung abgelaufen' }; }
      throw e;
    }
    return this.t.access;
  },
  logout() { this.t = null; this.save(); },
};

// ---------- Microsoft Graph ----------
const G = {
  base: 'https://graph.microsoft.com/v1.0',
  async req(method, url, { body, headers = {}, ok = [] } = {}, attempt = 0) {
    const tok = await Auth.accessToken(attempt === 1 && this._401);
    let r;
    try {
      r = await withTimeout(fetch(url.startsWith('http') ? url : this.base + url, { method, headers: { Authorization: 'Bearer ' + tok, ...headers }, body }), 180000, 'OneDrive antwortet nicht');
    } catch (e) { const err = new Error(e.message || 'Keine Verbindung zu OneDrive'); err.network = true; throw err; }
    if (r.status === 401 && attempt === 0) { this._401 = true; return this.req(method, url, { body, headers, ok }, 1); }
    this._401 = false;
    if ((r.status === 429 || r.status === 503 || r.status === 504) && attempt < 3) {
      const wait = Math.min(30, +(r.headers.get('Retry-After') || 3)) * 1000;
      await sleep(wait);
      return this.req(method, url, { body, headers, ok }, attempt + 1);
    }
    if (!r.ok && !ok.includes(r.status)) {
      let j = null;
      try { j = await r.json(); } catch { /* ignore */ }
      const e = new Error(j?.error?.message || 'OneDrive-Fehler ' + r.status);
      e.status = r.status; e.code = j?.error?.code;
      throw e;
    }
    if (r.status === 204 || ok.includes(r.status)) return { _status: r.status };
    const ct = r.headers.get('content-type') || '';
    return ct.includes('json') ? r.json() : r;
  },
  json(method, url, obj, headers = {}) { return this.req(method, url, { body: JSON.stringify(obj), headers: { 'Content-Type': 'application/json', ...headers } }); },
};

// ---------- sync engine ----------
const Cloud = {
  status: 'idle', lastSync: 0, lastError: '', busyText: '', running: false, again: false, timer: null,
  states: new Map(), rootId: null, rootUrl: '', deletes: [], wanted: new Set(), justLoggedIn: false,
  configured() { return !!CFG().clientId; },
  signedIn() { return !!Auth.t && !Auth.t.needsLogin; },
  async boot() {
    Auth.load();
    await Auth.handleRedirect();
  },
  async start() {
    const metas = ((await IDB.all('meta')) || []).filter(Boolean);
    for (const m of metas) {
      if (m.kind === 'sync') this.states.set(m.pid, m);
      if (m.kind === 'root') { this.rootId = m.id; this.rootUrl = m.webUrl || ''; this.rootFolder = m.folder; }
      if (m.kind === 'deletes') this.deletes = m.list || [];
      if (m.kind === 'last') this.lastSync = m.ts || 0;
    }
    if (this.rootFolder && this.rootFolder !== CFG().folder) this.rootId = null;
    window.addEventListener('online', () => this.schedule(800));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.schedule(1500); });
    setInterval(() => { if (document.visibilityState === 'visible') this.schedule(0); }, 120000);
    if (this.justLoggedIn) { toast(`Mit OneDrive verbunden${Auth.t?.name ? ' als ' + Auth.t.name : ''}. Abgleich startet …`, 'ok', 5000); this.justLoggedIn = false; }
    this.schedule(300);
  },
  saveMeta(key, val) { return IDB.put('meta', val, key); },
  saveState(st) { this.states.set(st.pid, st); return this.saveMeta('sync:' + st.pid, { ...st, kind: 'sync' }); },
  localChange(path) {
    if (!path.startsWith('projects/')) return;
    this.refreshUI();
    this.schedule(4000);
  },
  schedule(ms) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.syncAll(), ms);
  },
  setStatus(s, extra = '') {
    this.status = s;
    if (s === 'error') this.lastError = extra;
    if (s === 'busy') this.busyText = extra;
    this.refreshUI();
  },
  pendingLocal() { return LocalDB.projectIds().some((pid) => LocalDB.hasDirty('projects/' + pid)); },
  badge() {
    if (!this.configured()) return { state: 'local', text: 'Nur auf diesem Gerät', title: 'OneDrive-Abgleich ist noch nicht eingerichtet.' };
    if (!Auth.t) return { state: 'local', text: 'OneDrive: nicht verbunden', title: 'Antippen zum Anmelden' };
    if (Auth.t.needsLogin) return { state: 'off', text: 'OneDrive: Anmeldung nötig', title: 'Antippen zum erneuten Anmelden' };
    if (this.status === 'busy' || this.running) return { state: 'busy', text: this.busyText || 'Synchronisiere …' };
    if (!navigator.onLine || this.status === 'offline') return { state: 'busy', text: 'Offline · lokal gespeichert', title: 'Alles ist auf diesem Gerät gespeichert und wird bei Verbindung mit OneDrive abgeglichen.' };
    if (this.status === 'error') return { state: 'off', text: 'OneDrive-Fehler', title: this.lastError + ' – antippen, um es erneut zu versuchen' };
    if (this.pendingLocal()) return { state: 'busy', text: 'Änderungen ausstehend' };
    return { state: 'ok', text: this.lastSync ? 'Synchronisiert ' + new Date(this.lastSync).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : 'OneDrive verbunden', title: 'Mit OneDrive abgeglichen' };
  },
  badgeClick() {
    if (!this.configured()) { this.setupDialog(); return; }
    if (!this.signedIn()) { Auth.login(); return; }
    toast('Abgleich mit OneDrive …');
    this.schedule(0);
  },
  refreshUI() {
    if (typeof syncUI === 'function') syncUI();
    for (const el of $$('.cloud-card')) this.renderCard(el);
  },
  // ---------- Graph helpers ----------
  async ensureRoot() {
    const folder = CFG().folder;
    if (this.rootId) return this.rootId;
    let item;
    try { item = await G.req('GET', `/me/drive/root:/${enc(folder)}`); }
    catch (e) {
      if (e.status !== 404) throw e;
      try { item = await G.json('POST', '/me/drive/root/children', { name: folder, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }); }
      catch (e2) { if (e2.status === 409) item = await G.req('GET', `/me/drive/root:/${enc(folder)}`); else throw e2; }
    }
    this.rootId = item.id; this.rootUrl = item.webUrl || '';
    await this.saveMeta('root', { kind: 'root', id: item.id, webUrl: this.rootUrl, folder });
    return this.rootId;
  },
  async listFolders(rootId) {
    const out = [];
    let url = `/me/drive/items/${rootId}/children?$top=200&$select=id,name,folder,webUrl`;
    while (url) {
      const j = await G.req('GET', url);
      for (const it of j.value || []) if (it.folder) out.push(it);
      url = j['@odata.nextLink'] || null;
    }
    return out;
  },
  async createFolder(parentId, name, conflict = 'rename') {
    return G.json('POST', `/me/drive/items/${parentId}/children`, { name: safeFile(name), folder: {}, '@microsoft.graph.conflictBehavior': conflict });
  },
  async readRemote(folderId) {
    let meta;
    try { meta = await G.req('GET', itemPath(folderId, CLOUD_FILE)); }
    catch (e) { if (e.status === 404) return null; throw e; }
    const url = meta['@microsoft.graph.downloadUrl'];
    const r = await withTimeout(fetch(url), 120000, 'Download dauert zu lange');
    if (!r.ok) throw new Error('Projektdaten konnten nicht geladen werden (' + r.status + ')');
    return { eTag: meta.eTag, data: await r.json() };
  },
  async writeRemote(folderId, payload, eTag) {
    const headers = { 'Content-Type': 'application/json' };
    if (eTag) headers['If-Match'] = eTag; else headers['If-None-Match'] = '*';
    return G.req('PUT', itemPath(folderId, CLOUD_FILE) + '/content', { body: JSON.stringify(payload), headers });
  },
  async uploadFile(folderId, rel, blob, conflict = 'rename') {
    if (blob.size <= 4 * 1024 * 1024) {
      return G.req('PUT', itemPath(folderId, rel) + `/content?@microsoft.graph.conflictBehavior=${conflict}`, { body: blob, headers: { 'Content-Type': blob.type || 'application/octet-stream' } });
    }
    const sess = await G.json('POST', itemPath(folderId, rel) + '/createUploadSession', { item: { '@microsoft.graph.conflictBehavior': conflict } });
    const CH = 320 * 1024 * 12;
    let pos = 0, res = null;
    while (pos < blob.size) {
      const end = Math.min(pos + CH, blob.size);
      const r = await withTimeout(fetch(sess.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${end - 1}/${blob.size}` }, body: blob.slice(pos, end) }), 180000, 'Upload dauert zu lange');
      if (!r.ok) throw new Error('Upload fehlgeschlagen (' + r.status + ')');
      if (r.status === 200 || r.status === 201) res = await r.json();
      pos = end;
    }
    return res;
  },
  // ---------- main loop ----------
  async syncAll() {
    clearTimeout(this.timer);
    if (!this.configured() || !this.signedIn()) { this.refreshUI(); return; }
    if (this.running) { this.again = true; return; }
    if (!navigator.onLine) { this.setStatus('offline'); return; }
    this.running = true;
    this.setStatus('busy', 'Synchronisiere …');
    let changedRemote = false;
    try {
      const rootId = await this.ensureRoot();
      const folders = await this.listFolders(rootId);
      const folderIds = new Set(folders.map((f) => f.id));
      for (const pid of LocalDB.projectIds()) changedRemote = (await this.syncProject(pid, folderIds)) || changedRemote;
      const known = new Set([...this.states.values()].map((s) => s.folderId));
      for (const f of folders) if (!known.has(f.id)) changedRemote = (await this.pullFolder(f)) || changedRemote;
      // web links for folders
      for (const f of folders) { const st = [...this.states.values()].find((s) => s.folderId === f.id); if (st && st.webUrl !== f.webUrl) { st.webUrl = f.webUrl; await this.saveState(st); } }
      await this.processDeletes();
      this.lastSync = Date.now();
      await this.saveMeta('last', { kind: 'last', ts: this.lastSync });
      this.setStatus('idle');
    } catch (e) {
      console.warn('Sync', e);
      if (e.code === 'login_required') this.setStatus('idle');
      else if (e.network || !navigator.onLine) this.setStatus('offline');
      else if (e.status === 403) this.setStatus('error', 'Kein Zugriff auf OneDrive (Berechtigung „Files.ReadWrite“ fehlt?)');
      else this.setStatus('error', e.message || String(e));
      if (!e.network && e.code !== 'login_required') this.schedule(60000);
    } finally {
      this.running = false;
      this.refreshUI();
      if (this.again) { this.again = false; this.schedule(1000); }
    }
    if (this.status === 'idle') this.prefetch();
    return changedRemote;
  },
  blobRefs(docs) {
    const refs = new Map();
    const ext = (pl) => (pl.kind === 'image' ? (pl.mime === 'image/png' ? '.png' : pl.mime === 'image/webp' ? '.webp' : '.jpg') : '.pdf');
    const byRoom = new Map();
    for (const [k, v] of Object.entries(docs)) {
      if (!v || v.del || !v.data) continue;
      if (k === 'project') {
        if (v.data.coverAssetId) refs.set(v.data.coverAssetId, { dest: 'photos', name: 'Titelbild.jpg', order: 1 });
        if (v.data.logoAssetId) refs.set(v.data.logoAssetId, { dest: 'root', name: 'Logo.png', order: 1 });
      } else if (k.startsWith('plans/') && v.data.assetId) {
        refs.set(v.data.assetId, { dest: 'root', name: 'Pläne/' + safeFile(v.data.name || 'Plan') + ext(v.data), order: 0 });
      } else if (k.startsWith('photos/') && v.data.assetId) {
        if (!byRoom.has(v.data.roomId)) byRoom.set(v.data.roomId, []);
        byRoom.get(v.data.roomId).push(v.data);
      }
    }
    for (const [roomId, list] of byRoom) {
      const room = docs['rooms/' + roomId]?.data;
      const rn = safeFile([room?.raumnr, room?.raumname].filter(Boolean).join(' ') || 'Raum');
      list.sort((a, b) => (a.ts || 0) - (b.ts || 0));
      list.forEach((ph, i) => refs.set(ph.assetId, { dest: 'photos', name: `${rn} - Foto ${i + 1}.jpg`, order: 2 }));
    }
    return refs;
  },
  // documentation folder (reports) with a photo subfolder – inside the project folder or in a folder chosen by the user
  async ensureDocFolders(st, projData, name) {
    const custom = projData?.docFolder?.id || null;
    let parent = custom || st.folderId;
    const getOrCreate = async (parentId, nm) => {
      try { return await this.createFolder(parentId, nm, 'fail'); }
      catch (e) { if (e.status !== 409) throw e; return G.req('GET', itemPath(parentId, nm)); }
    };
    if (st.docId && st.docParent === parent && st.photoId) return st;
    try {
      if (st.docId && st.docParent && st.docParent !== parent) {
        this.setStatus('busy', 'Verschiebe Dokumentation …');
        try {
          const moved = await G.json('PATCH', `/me/drive/items/${st.docId}`, { parentReference: { id: parent } });
          st.docUrl = moved.webUrl || st.docUrl;
        } catch (e) {
          if (e.status === 409) { const moved = await G.json('PATCH', `/me/drive/items/${st.docId}`, { parentReference: { id: parent }, name: safeFile(DOC_FOLDER + ' ' + name) }); st.docUrl = moved.webUrl || st.docUrl; }
          else if (e.status === 404) st.docId = null;
          else throw e;
        }
      }
      if (!st.docId) { const d = await getOrCreate(parent, DOC_FOLDER); st.docId = d.id; st.docUrl = d.webUrl || ''; }
    } catch (e) {
      if (e.status === 404 && custom) { // chosen folder no longer exists -> fall back to the project folder
        toast('Gewählter Ablageordner nicht gefunden – Dokumentation wird im Projektordner abgelegt.', 'error', 7000);
        parent = st.folderId;
        const d = await getOrCreate(parent, DOC_FOLDER); st.docId = d.id; st.docUrl = d.webUrl || '';
      } else throw e;
    }
    st.docParent = parent;
    const p = await getOrCreate(st.docId, PHOTO_FOLDER);
    st.photoId = p.id;
    await this.saveState(st);
    return st;
  },
  async syncProject(pid, folderIds) {
    const prefix = 'projects/' + pid;
    const projRec = LocalDB.raw(prefix);
    let st = this.states.get(pid) || { pid, folderId: null, eTag: null, blobs: {}, webUrl: '' };
    if (!projRec) return false;
    if (projRec.del) {
      if (st.folderId) { this.setStatus('busy', 'Lösche Projekt in OneDrive …'); await G.req('DELETE', `/me/drive/items/${st.folderId}`, { ok: [404] }); }
      LocalDB.purge(prefix);
      this.states.delete(pid); await IDB.del('meta', 'sync:' + pid);
      return false;
    }
    if (st.folderId && !folderIds.has(st.folderId)) {
      // folder was removed in OneDrive (e.g. project deleted on the other device)
      if (!LocalDB.hasDirty(prefix)) {
        LocalDB.purge(prefix);
        this.states.delete(pid); await IDB.del('meta', 'sync:' + pid);
        return true;
      }
      st = { ...st, folderId: null, eTag: null, blobs: {} };
    }
    const name = projRec.data?.name || 'Projekt';
    if (!st.folderId) {
      this.setStatus('busy', `Lege „${name}“ in OneDrive an …`);
      const f = await this.createFolder(this.rootId, name);
      st.folderId = f.id; st.webUrl = f.webUrl || ''; st.eTag = null;
      await this.saveState(st);
      try { await this.createFolder(f.id, 'Pläne', 'fail'); } catch (e) { if (e.status !== 409) throw e; }
    }
    let changedRemote = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      this.setStatus('busy', `Gleiche „${name}“ ab …`);
      const remote = await this.readRemote(st.folderId);
      const dirty = LocalDB.hasDirty(prefix);
      const blobsMissing = [...this.blobRefs(this.localDocs(prefix)).keys()].some((id) => !st.blobs[id]?.odId && !remote?.data?.blobs?.[id]?.odId);
      if (remote && remote.eTag === st.eTag && !dirty && !blobsMissing) break;
      // ---- merge (last writer wins per document) ----
      const rdocs = remote?.data?.docs || {};
      const out = {};
      let needUpload = !remote;
      const rel = (p) => (p === prefix ? 'project' : p.slice(prefix.length + 1));
      const abs = (k) => (k === 'project' ? prefix : prefix + '/' + k);
      const keys = new Set([...LocalDB.records(prefix).map((r) => rel(r.path)), ...Object.keys(rdocs)]);
      for (const k of keys) {
        const L = LocalDB.raw(abs(k)), R = rdocs[k];
        if (R && (!L || R.ts > L.ts)) { out[k] = R; LocalDB.applyRemote(abs(k), R); changedRemote = true; }
        else if (L) { out[k] = { data: L.del ? null : L.data, ts: L.ts, del: !!L.del }; if (!R || L.ts > R.ts) needUpload = true; }
      }
      // drop old tombstones (90 days)
      const cutoff = Date.now() - 90 * 864e5;
      for (const [k, v] of Object.entries(out)) if (v.del && v.ts < cutoff) delete out[k];
      // ---- files ----
      st.blobs = { ...(remote?.data?.blobs || {}), ...st.blobs };
      const refs = this.blobRefs(out);
      await this.ensureDocFolders(st, out.project?.data, name);
      for (const [id, ref] of [...refs].sort((a, b) => a[1].order - b[1].order)) {
        if (st.blobs[id]?.odId) continue;
        const rec = await Blobs.get(id);
        if (!rec) continue;
        this.setStatus('busy', `Lade ${ref.name.split('/').pop()} hoch …`);
        let item;
        try { item = await this.uploadFile(ref.dest === 'photos' ? st.photoId : st.folderId, ref.name, rec.blob, 'rename'); }
        catch (e) {
          if (e.status !== 404 || ref.dest !== 'photos') throw e;
          st.docId = null; st.photoId = null; // folder removed by the user -> create again
          await this.ensureDocFolders(st, out.project?.data, name);
          item = await this.uploadFile(st.photoId, ref.name, rec.blob, 'rename');
        }
        st.blobs[id] = { odId: item.id, name: item.name, type: rec.type, size: rec.size };
        needUpload = true;
        await this.saveState(st);
      }
      const blobs = {};
      for (const id of refs.keys()) if (st.blobs[id]) blobs[id] = st.blobs[id];
      if (JSON.stringify(blobs) !== JSON.stringify(remote?.data?.blobs || {})) needUpload = true;
      st.blobs = blobs;
      if (!needUpload) { st.eTag = remote.eTag; for (const [k, v] of Object.entries(out)) LocalDB.markClean(abs(k), v.ts); break; }
      this.setStatus('busy', `Speichere „${name}“ in OneDrive …`);
      try {
        const item = await this.writeRemote(st.folderId, { format: 'begehung-sync', version: 1, projectId: pid, name, savedAt: new Date().toISOString(), docs: out, blobs }, remote?.eTag);
        st.eTag = item.eTag;
        for (const [k, v] of Object.entries(out)) LocalDB.markClean(abs(k), v.ts);
        break;
      } catch (e) {
        if (e.status === 412 || e.status === 409) continue; // changed meanwhile on the other device -> merge again
        throw e;
      }
    }
    st.lastSync = Date.now();
    await this.saveState(st);
    return changedRemote;
  },
  localDocs(prefix) {
    const out = {};
    for (const r of LocalDB.records(prefix)) out[r.path === prefix ? 'project' : r.path.slice(prefix.length + 1)] = { data: r.data, ts: r.ts, del: r.del };
    return out;
  },
  async pullFolder(f) {
    let remote;
    try { remote = await this.readRemote(f.id); } catch (e) { console.warn(e); return false; }
    if (!remote || remote.data?.format !== 'begehung-sync' || !remote.data.projectId) return false;
    const pid = remote.data.projectId;
    const existing = this.states.get(pid);
    if (existing && existing.folderId && existing.folderId !== f.id) return false; // copy of a known project folder – ignore
    this.setStatus('busy', `Lade „${remote.data.name || f.name}“ …`);
    const prefix = 'projects/' + pid;
    for (const [k, rec] of Object.entries(remote.data.docs || {})) {
      const path = k === 'project' ? prefix : prefix + '/' + k;
      const L = LocalDB.raw(path);
      if (!L || rec.ts > L.ts) LocalDB.applyRemote(path, rec);
    }
    await this.saveState({ pid, folderId: f.id, eTag: remote.eTag, blobs: remote.data.blobs || {}, webUrl: f.webUrl || '', lastSync: Date.now() });
    return true;
  },
  // ---------- files ----------
  findBlob(id) {
    for (const st of this.states.values()) if (st.blobs?.[id]?.odId) return st.blobs[id];
    return null;
  },
  async downloadBlob(id) {
    const meta = this.findBlob(id);
    if (!meta || !this.signedIn() || !navigator.onLine) return null;
    const item = await G.req('GET', `/me/drive/items/${meta.odId}`);
    const r = await withTimeout(fetch(item['@microsoft.graph.downloadUrl']), 180000, 'Download dauert zu lange');
    if (!r.ok) throw new Error('Download fehlgeschlagen (' + r.status + ')');
    const blob = await r.blob();
    await Blobs.put(id, blob, meta.type || blob.type);
    return blob;
  },
  wantBlob(id) {
    if (this.wanted.has(id)) return;
    this.wanted.add(id);
    this.downloadBlob(id).catch((e) => console.warn(e)).finally(() => this.wanted.delete(id));
  },
  async prefetch() {
    if (this.prefetching || !this.signedIn() || !navigator.onLine) return;
    this.prefetching = true;
    try {
      const jobs = [];
      for (const st of this.states.values()) {
        const refs = this.blobRefs(this.localDocs('projects/' + st.pid));
        for (const [id, ref] of refs) if (st.blobs?.[id]?.odId) jobs.push([ref.order, id]);
      }
      jobs.sort((a, b) => a[0] - b[0]);
      let n = 0;
      for (const [, id] of jobs) {
        if (await Blobs.get(id)) continue;
        if (!navigator.onLine) break;
        n++;
        this.busyText = `Lade Dateien für offline (${n}) …`; this.refreshUI();
        try { await this.downloadBlob(id); } catch (e) { console.warn('prefetch', e); }
      }
    } finally { this.prefetching = false; this.busyText = ''; this.refreshUI(); }
  },
  blobDeleted(id) {
    for (const st of this.states.values()) {
      if (st.blobs?.[id]?.odId) { this.deletes.push(st.blobs[id].odId); delete st.blobs[id]; this.saveState(st); }
    }
    this.saveMeta('deletes', { kind: 'deletes', list: this.deletes });
  },
  async processDeletes() {
    while (this.deletes.length) {
      const id = this.deletes[0];
      await G.req('DELETE', `/me/drive/items/${id}`, { ok: [404] });
      this.deletes.shift();
      await this.saveMeta('deletes', { kind: 'deletes', list: this.deletes });
    }
  },
  async uploadReport(pid, filename, blob) {
    const st = this.states.get(pid);
    if (!st?.folderId || !this.signedIn() || !navigator.onLine) return false;
    try {
      const proj = LocalDB.raw('projects/' + pid)?.data;
      await this.ensureDocFolders(st, proj, proj?.name || '');
      await this.uploadFile(st.docId, safeFile(filename), blob, 'replace');
      return true;
    }
    catch (e) { console.warn(e); toast('Bericht wurde lokal gespeichert, aber nicht in OneDrive: ' + (e.message || e), 'error', 6000); return false; }
  },
  // ---------- UI ----------
  docLocation(p, st) {
    if (!p) return null;
    const where = p.docFolder?.path ? p.docFolder.path + '/' + DOC_FOLDER : `${CFG().folder}/${p.name || 'Projekt'}/${DOC_FOLDER}`;
    return h('div', { style: { marginTop: '12px', padding: '10px 12px', background: 'var(--surface-2)', border: '1px solid var(--line)', borderRadius: '8px' } },
      h('div', { class: 'small muted' }, 'Ablage der Dokumentation (Berichte) und Einzelfotos'),
      h('div', { style: { fontWeight: 600, margin: '2px 0 8px', wordBreak: 'break-word' } }, where, h('span', { class: 'muted', style: { fontWeight: 400 } }, '  ·  Fotos in „' + PHOTO_FOLDER + '“')),
      h('div', { class: 'row' },
        btn('Ordner wählen …', { icon: 'layers', sm: true, onClick: () => this.pickFolder(p) }),
        p.docFolder ? btn('Standard verwenden', { sm: true, kind: 'ghost', onClick: () => { patchDoc('projects/' + p.id, { docFolder: null, updatedAt: Date.now() }); this.schedule(500); } }) : null));
  },
  pickFolder(p) {
    if (!this.signedIn() || !navigator.onLine) { toast('Dafür wird eine Verbindung zu OneDrive benötigt.'); return; }
    const trail = [{ id: 'root', name: 'Mein OneDrive' }];
    const list = h('div', { class: 'tbl-wrap', style: { maxHeight: '50vh' } });
    const crumbs = h('div', { class: 'row small' });
    const render = async () => {
      crumbs.replaceChildren(...trail.flatMap((t, i) => [i ? h('span', { class: 'muted' }, '›') : null,
        h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { trail.splice(i + 1); render(); } }, t.name)]).filter(Boolean));
      list.replaceChildren(h('div', { class: 'progress', style: { padding: '14px' } }, h('div', { class: 'spinner' }), 'Lade Ordner …'));
      try {
        const cur = trail[trail.length - 1];
        const base = cur.id === 'root' ? '/me/drive/root/children' : `/me/drive/items/${cur.id}/children`;
        const out = [];
        let url = base + '?$top=200&$select=id,name,folder,webUrl';
        while (url) { const j = await G.req('GET', url); for (const it of j.value || []) if (it.folder) out.push(it); url = j['@odata.nextLink'] || null; }
        out.sort((a, b) => natCmp(a.name, b.name));
        list.replaceChildren(out.length ? h('table', { class: 'tbl' }, h('tbody', null, out.map((f) => h('tr', { class: 'click', onclick: () => { trail.push({ id: f.id, name: f.name, webUrl: f.webUrl }); render(); } },
          h('td', null, icon('layers'), ' ', f.name), h('td', { class: 'muted small', style: { textAlign: 'right' } }, (f.folder?.childCount ?? '') + ' ›'))))) : h('div', { class: 'muted', style: { padding: '14px' } }, 'Keine Unterordner.'));
      } catch (e) { list.replaceChildren(h('div', { style: { padding: '14px', color: 'var(--danger)' } }, 'Ordner konnten nicht geladen werden: ' + (e.message || e))); }
    };
    render();
    modal({
      title: 'Ablageordner für die Dokumentation', wide: true,
      body: [h('div', { class: 'muted small' }, `Wähle z. B. den Projektordner. Darin legt die App den Unterordner „${DOC_FOLDER}“ mit den Berichten und dem Ordner „${PHOTO_FOLDER}“ an. Bereits abgelegte Dateien werden mit verschoben.`), crumbs, list],
      actions: [
        { label: 'Abbrechen' },
        {
          label: 'Hier ablegen', primary: true, onClick: () => {
            const cur = trail[trail.length - 1];
            if (cur.id === 'root') { toast('Bitte einen Ordner wählen.'); return false; }
            patchDoc('projects/' + p.id, { docFolder: { id: cur.id, path: trail.slice(1).map((t) => t.name).join('/'), webUrl: cur.webUrl || '' }, updatedAt: Date.now() });
            toast('Ablageort gespeichert – wird beim nächsten Abgleich übernommen.', 'ok');
            this.schedule(500);
          },
        },
      ],
    });
  },
  setupDialog() {
    const c = CFG();
    const fromFile = !!(window.BEGEHUNG_CONFIG || {}).clientId;
    const cid = h('input', { type: 'text', value: c.clientId, placeholder: 'z. B. 1a2b3c4d-…', autofocus: true });
    const tid = h('input', { type: 'text', value: c.tenantId === 'organizations' ? '' : c.tenantId, placeholder: 'Verzeichnis-ID (Mandanten-ID)' });
    modal({
      title: 'OneDrive-Abgleich einrichten', wide: true,
      body: [
        h('div', { class: 'muted' }, 'Trage die Werte aus der App-Registrierung in Microsoft Entra ID ein (siehe Anleitung). Dauerhaft für alle Geräte geht das in der Datei config.js; hier eingetragene Werte gelten nur für dieses Gerät.'),
        fromFile ? h('div', { class: 'small muted' }, 'Hinweis: config.js enthält bereits eine Anwendungs-ID.') : null,
        h('label', { class: 'fld' }, 'Anwendungs-ID (Client-ID)', cid),
        h('label', { class: 'fld' }, 'Verzeichnis-ID (Mandanten-ID) – optional', tid),
        h('div', { class: 'small muted' }, 'Umleitungs-URI für die Registrierung (Plattform „Single-Page-Anwendung“): ' + Auth.redirectUri()),
      ],
      actions: [
        { label: 'Abbrechen' },
        { label: 'Speichern und anmelden', primary: true, onClick: () => { lsSet('begehung.cfg.clientId', cid.value.trim() || null); lsSet('begehung.cfg.tenantId', tid.value.trim() || null); this.refreshUI(); if (cid.value.trim()) setTimeout(() => Auth.login(), 50); } },
      ],
    });
  },
  card(kind, p) {
    const el = h('div', { class: 'card section cloud-card', 'data-kind': kind, 'data-pid': p?.id || '' });
    this.renderCard(el);
    return el;
  },
  renderCard(el) {
    const kind = el.dataset.kind;
    const pid = el.dataset.pid;
    const b = this.badge();
    const parts = [];
    const install = _installPrompt && kind === 'home' ? btn('App installieren', { icon: 'download', onClick: async () => { const e = _installPrompt; _installPrompt = null; try { await e.prompt(); } catch { /* ignore */ } this.refreshUI(); } }) : null;
    if (!this.configured()) {
      parts.push(h('h2', null, 'OneDrive-Abgleich'),
        h('div', { class: 'muted' }, 'Noch nicht eingerichtet. Ohne OneDrive bleiben die Daten nur auf diesem Gerät.'),
        h('div', { class: 'row', style: { marginTop: '10px' } }, btn('Einrichten', { icon: 'settings', kind: 'primary', onClick: () => this.setupDialog() }), install));
    } else if (!Auth.t || Auth.t.needsLogin) {
      parts.push(h('h2', null, 'OneDrive-Abgleich'),
        h('div', { class: 'muted' }, Auth.t?.needsLogin ? 'Die Anmeldung ist abgelaufen. Bitte neu anmelden – deine Daten sind weiterhin lokal gespeichert.' : 'Mit deinem Microsoft-365-Konto anmelden, damit PC und Tablet dieselben Projekte sehen.'),
        h('div', { class: 'row', style: { marginTop: '10px' } }, btn(Auth.t?.needsLogin ? 'Neu anmelden' : 'Mit Microsoft anmelden', { icon: 'upload', kind: 'primary', onClick: () => Auth.login() }),
          btn('Einstellungen', { sm: true, kind: 'ghost', onClick: () => this.setupDialog() }), install));
    } else {
      const st = pid ? this.states.get(pid) : null;
      const link = kind === 'project' ? st?.webUrl : this.rootUrl;
      parts.push(h('div', { class: 'row' }, h('h2', { class: 'grow', style: { margin: 0 } }, kind === 'project' ? 'OneDrive' : 'OneDrive-Abgleich'), h('span', { class: 'badge ' + (b.state === 'ok' ? 'ok' : b.state === 'off' ? 'crit' : 'warn') }, b.text)),
        h('div', { class: 'muted', style: { marginTop: '6px' } },
          `Angemeldet als ${Auth.t.name || Auth.t.username || 'Microsoft-Konto'}${Auth.t.username && Auth.t.name ? ' (' + Auth.t.username + ')' : ''} · Ordner „${CFG().folder}${kind === 'project' ? '/' + (project()?.name || '') : ''}“`,
          kind === 'project' && !st?.folderId ? ' · noch nicht hochgeladen' : ''),
        this.status === 'error' ? h('div', { class: 'small', style: { color: 'var(--danger)', marginTop: '4px' } }, this.lastError) : null,
        kind === 'project' ? this.docLocation(project(), st) : null,
        h('div', { class: 'row', style: { marginTop: '10px' } },
          btn('Jetzt synchronisieren', { icon: 'undo', sm: true, kind: 'primary', disabled: this.running, onClick: () => this.schedule(0) }),
          link ? h('a', { class: 'btn sm', href: link, target: '_blank', rel: 'noopener' }, icon('layers'), kind === 'project' ? 'Projektordner öffnen' : 'In OneDrive öffnen') : null,
          kind === 'project' && st?.docUrl ? h('a', { class: 'btn sm', href: st.docUrl, target: '_blank', rel: 'noopener' }, icon('file'), 'Dokumentation öffnen') : null,
          kind === 'home' ? btn('Abmelden', { sm: true, kind: 'ghost', onClick: async () => { if (await confirmBox('Von OneDrive abmelden?', 'Die Daten bleiben auf diesem Gerät. Ohne Anmeldung wird nicht mehr abgeglichen.', 'Abmelden')) { Auth.logout(); this.refreshUI(); } } }) : null,
          install));
    }
    el.replaceChildren(...parts.filter(Boolean));
  },
};

</script>
